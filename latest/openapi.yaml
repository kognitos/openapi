          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: thread_id
          description: Required. The ID of the thread to compact.
          in: path
          required: true
          schema:
            type: string
      requestBody:
