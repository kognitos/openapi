          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: start_date.day
          description: >-
            Day of a month. Must be from 1 to 31 and valid for the year and
            month, or 0

            to specify a year by itself or a year and month where the day isn't

            significant.
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: end_date.year
          description: >-
            Year of the date. Must be from 1 to 9999, or 0 to specify a date
            without

            a year.
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: end_date.month
          description: >-
            Month of a year. Must be from 1 to 12, or 0 to specify a year
            without a

            month and day.
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: end_date.day
          description: >-
            Day of a month. Must be from 1 to 31 and valid for the year and
            month, or 0

            to specify a year by itself or a year and month where the day isn't

            significant.
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: time_zone
          description: >-
            Time zone for date aggregation.

            Format: IANA timezone identifier (e.g., "America/New_York", "UTC", "Europe/London")
          in: query
          required: true
          schema:
            type: string
        - name: filter
          description: >-
            Filter expression for filtering runs included in the aggregation.

            Follows the structured syntax defined in AIP-160.


            Supported fields for filtering:

            - automation_id: The unique identifier of the automation (string)


            Supported operators:

            - Comparison: =

            - Logical: OR


            Examples:

            - Filter by specific automation:
              "automation_id = \"789\""
            - Filter by multiple automations:
              "automation_id = \"789\" OR automation_id = \"790\""

            If an invalid filter expression is provided, the API will return INVALID_ARGUMENT.
          in: query
          required: false
          schema:
            type: string
      tags:
        - Runs
