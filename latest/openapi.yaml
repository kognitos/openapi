            type: string
        - name: filter
          description: |-
            Optional REL expression filtering over thread fields.
            Empty = no filter.

            Supported fields:
              agent_id                          (string)
              status                            (string, snake_case discriminant)
              variables.<key>, metadata.<key>   (string)
              title, description                (optional string)
              created_at, updated_at            (RFC-3339 string literal)
              agent_version                     (integer)
              origin.kind                       (string: "schedule" / "sub_agent")
              origin.schedule.schedule_id       (string)
              origin.sub_agent.parent_agent_id  (string)
              origin.sub_agent.parent_thread_id (string)
              origin.sub_agent.task_id          (string)
              hydration                         (string: "hydrated" / "dehydrated")

            Examples:
              variables.region == "us-east" && updated_at >= "2026-05-01T00:00:00Z"
              title.contains("invoice")
              agent_version in [3, 4, 5]
              origin.kind == "schedule"
              has(origin.sub_agent.parent_agent_id)
          in: query
          required: false
          schema:
            type: string
