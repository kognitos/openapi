            type: string
        - name: book_version
          in: path
          required: true
          schema:
            type: string
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
        - name: thread_id
          description: Required. The ID of the thread to delete.
          in: path
          required: true
          schema:
            type: string
      tags:
        - Agents
  ? "/api/v1/organizations/{organization_id}/workspaces/{workspace_id}/books/{book_name}/versions/{book_version}/connections/{connection_id}/agents/shifu/threads/{thread_id}/events"
  : get:
      summary: Get Thread Events (Shifu, book connection)
      description: |-
        Retrieves all events from a thread.

        This RPC returns the complete history of events for a thread, including
        user inputs, assistant responses, tool calls, and their results.
        Events are returned in chronological order.

        Targets the built-in `shifu` agent in the book connection scope; the generic form is `GetThreadEvents` on `/agents/{agent_id}`.
      operationId: BookConnectionShifuGetThreadEvents
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agentsV1GetEventsResponse"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: book_name
          in: path
          required: true
          schema:
            type: string
        - name: book_version
          in: path
          required: true
          schema:
            type: string
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
        - name: thread_id
          description: Required. The ID of the thread to retrieve events from.
          in: path
          required: true
          schema:
            type: string
        - name: compacted
          description: |-
            Optional. If true, return the compacted view of events.
            The compacted view shows what the LLM sees: events in compacted ranges
            are excluded and replaced by CompactComplete events containing summaries.
            If false (default), returns the full event history for UI display.
          in: query
          required: false
          schema:
            type: boolean
        - name: include_deleted
          description: |-
            Optional. If true, include deleted events in the response.
            Deleted events will have the `deleted` field set to true on each event.
          in: query
          required: false
          schema:
            type: boolean
      tags:
        - Agents
  ? "/api/v1/organizations/{organization_id}/workspaces/{workspace_id}/books/{book_name}/versions/{book_version}/connections/{connection_id}/agents/shifu/threads/{thread_id}/input"
  : post:
      summary: Send Message (Shifu, book connection)
      description: |-
        Sends a message to a thread (fire and forget).

        The message is added to the thread and generation begins asynchronously.
        Response events arrive via SubscribeThread stream or SSE, not this RPC.

        Targets the built-in `shifu` agent in the book connection scope; the generic form is `SendMessage` on `/agents/{agent_id}`.
      operationId: BookConnectionShifuSendMessage
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agentsV1SendMessageResponse"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: book_name
          in: path
          required: true
          schema:
            type: string
        - name: book_version
          in: path
          required: true
          schema:
            type: string
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
        - name: thread_id
          description: Required. The ID of the thread to send the message to.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/agentsThreadServiceSendMessageBody"
        required: true
      tags:
        - Agents
  ? "/api/v1/organizations/{organization_id}/workspaces/{workspace_id}/books/{book_name}/versions/{book_version}/connections/{connection_id}/agents/shifu/threads/{thread_id}/stream"
  : get:
      summary: Stream Thread Events (Shifu, book connection)
      description: |-
        Subscribe to thread events via SSE

        Opens a persistent SSE connection that streams all events for the specified thread.

        **Event Flow:**
        1. Historical events are sent first (if the thread has existing events)
        2. Live events are streamed as they occur (InputText, OutputText, ToolCall*, etc.)
        3. Connection stays open until the client disconnects

        **SSE Message Format:**
        Each message contains a JSON-serialized `Event` object in the `data` field:
        ```
        data: {"output_text":{"text":"Hello"}}

        data: {"generation_complete":{"usage":{"prompt_tokens":10,"completion_tokens":5}}}
        ```

        **Extracting Events:**
        ```javascript
        const eventSource = new EventSource('/agents/my-agent/threads/my-thread/stream');
        eventSource.onmessage = (e) => {
          const event = JSON.parse(e.data);
          if (event.output_text) {
            console.log('Output:', event.output_text.text);
          }
        };
        ```

        This is the browser-compatible alternative to the gRPC `SubscribeThread` RPC.

        Targets the built-in `shifu` agent in the book connection scope; the generic form is `StreamThreadEvents` on `/agents/{agent_id}`.
      operationId: BookConnectionShifuStreamThreadEvents
      responses:
        "200":
          description: SSE stream of thread events
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-sent events; each `data:` line is a JSON `agentsV1Event`.
        "404":
          description: Agent or thread not found
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: book_name
          in: path
          required: true
          schema:
            type: string
        - name: book_version
          in: path
          required: true
          schema:
            type: string
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
        - name: thread_id
          in: path
          description: The ID of the thread to subscribe to.
          required: true
          schema:
            type: string
      tags:
        - Agents
  ? "/api/v1/organizations/{organization_id}/workspaces/{workspace_id}/books/{book_name}/versions/{book_version}/connections/{connection_id}/agents/shifu/threads/{thread_id}/tool-results"
  : post:
      summary: Send Tool Result (Shifu, book connection)
      description: |-
        Sends a tool execution result for a remote tool.

        Remote tools pause generation when called, waiting for an external system
        to execute them and return the result via this RPC. Generation resumes
        once the result is received.

        Targets the built-in `shifu` agent in the book connection scope; the generic form is `SendToolResult` on `/agents/{agent_id}`.
      operationId: BookConnectionShifuSendToolResult
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agentsV1SendToolResultResponse"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: book_name
          in: path
          required: true
          schema:
            type: string
        - name: book_version
          in: path
          required: true
          schema:
            type: string
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
        - name: thread_id
          description: Required. The ID of the thread where the remote tool was called.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/agentsThreadServiceSendToolResultBody"
        required: true
      tags:
        - Agents
  ? "/api/v1/organizations/{organization_id}/workspaces/{workspace_id}/books/{book_name}/versions/{book_version}/connections/{connection_id}/agents/shifu/threads/{thread_id}/tool-sources"
  : post:
      summary: Create Tool Source (Shifu, book connection)
      description: |-
        Creates a new tool source for a thread.

        Targets the built-in `shifu` agent in the book connection scope; the generic form is `CreateToolSource` on `/agents/{agent_id}`.
