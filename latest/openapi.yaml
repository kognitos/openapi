          description: |-
            User feedback for generation responses (keyed by generation_id).
            Used for analytics and UI, not visible to the LLM.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary key-value metadata attached by the thread creator.
        event_count:
          type: string
          format: int64
          description: Number of events in this thread.
        agent_version:
          type: string
          format: uint64
          description: |-
            Agent version this thread is pinned to.

            The thread resolves its agent template against this specific
            version for the rest of its life. Moving a thread to a newer
            version is an explicit user action (UpgradeThread / Deploy
            re-pin), never a side effect of an agent save.

            Zero is the sentinel for threads created without a pin (e.g.
            before the agent_version column existed); the server resolves
            such threads as current head.
        updated_at:
          type: string
          format: date-time
          description: |-
            When the thread was last modified.

            Bumped on any state change: event append, metadata edit, feedback
            edit, variable extension via UpgradeThread, plan/memory/scratchpad
            writes, etc. ListThreads returns threads sorted by this field in
            descending order (most recently active first); pre-existing
            threads from before this field was added fall back to created_at.
        created_by:
          $ref: "#/components/schemas/agentsV1PrincipalRef"
        updated_by:
          $ref: "#/components/schemas/agentsV1PrincipalRef"
        origin:
          $ref: "#/components/schemas/agentsV1ThreadOrigin"
        status:
          $ref: "#/components/schemas/agentsV1ThreadStatus"
        status_updated_at:
          type: string
          format: date-time
          description: When the thread entered its current status.
        plan_active:
          type: boolean
          description: Whether a plan is active on the thread (orthogonal to status).
        agent_id:
          type: string
          description: |-
            The owning agent's id. Populated by cross-agent listings (ListAllThreads);
            empty for single-agent listings where the agent is implied by the request.
        agent_name:
          type: string
          description: |-
            The owning agent's display name. Populated by cross-agent listings;
            empty otherwise.
        cost:
          $ref: "#/components/schemas/agentsV1Cost"
        stats:
          $ref: "#/components/schemas/agentsV1ThreadStats"
        dehydration:
          $ref: "#/components/schemas/agentsV1DehydrationState"
      description: A conversation thread with an AI agent.
    agentsV1DuplicateAgentResponse:
      type: object
      properties:
        id:
          type: string
          description: The newly created agent's unique identifier.
        name:
          type: string
          description: The agent's display name.
      description: Response message for DuplicateAgent.
    agentsV1DiscardArtifactsResponse:
      type: object
      properties:
        discarded_count:
          type: integer
          format: int64
          description: Number of artifacts discarded.
        additions:
          type: integer
          format: int64
          description: Number of additions discarded.
        modifications:
          type: integer
          format: int64
          description: Number of modifications discarded.
        deletions:
          type: integer
          format: int64
          description: Number of deletions discarded.
      description: Response for DiscardArtifacts.
    agentsV1DeleteEventResponse:
      type: object
      properties:
        from_event_id:
          type: string
          format: uint64
        to_event_id:
          type: string
          format: uint64
    agentsV1SendToolCallResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: Whether the call was accepted (validated and queued for execution).
        tool_call_id:
          type: string
          description: |-
            The minted tool_call_id. Clients can correlate against the resulting
            ToolCallStart / ToolResult events on the thread event stream.
      description: Response from injecting a tool call.
    agentsThreadServiceResetEventsBody:
      type: object
      properties: {}
      description: Request message for ResetEvents (clear all events and feedback from a thread).
    agentsV1StartCompactionResponse:
      type: object
      properties:
        compact_id:
          type: string
          description: The unique ID assigned to this compaction operation.
      description: Response for starting context compaction.
    agentsV1ImportAgentRequest:
      type: object
      properties:
        format:
          type: string
          description: Required. The import format kind (e.g., "yaml", "kubernetes").
        data:
          type: string
          format: byte
          description: Required. Raw file content to import.
        config:
          type: object
          description: Format-specific configuration options.
      description: Request message for ImportAgent.
      required:
        - format
        - data
    agentsToolCatalogServiceCreateToolSourceBody:
      type: object
      properties:
        type:
          type: string
          description: Required. The tool source type (e.g., "rust", "grpc").
        config:
          type: object
          description: |-
            Required. Configuration for the tool source.
            Keys and values depend on the type's config_fields.
        source_id:
          type: string
          description: |-
            Optional. The id to give the source, instead of a generated one.

            For client-declared capabilities, which name their source `client.<id>`
            so that toggling one off can address it and toggling it on twice cannot
            produce two copies. Rejected when a source already holds the id, and
            rejected if it contains ':' — that character is reserved for custom
            methods in resource paths, so an id carrying one could never be
            addressed again.
      description: Request message for CreateToolSource.
      required:
        - type
        - config
    agentsV1ToolEnablement:
      type: object
      properties:
        source_id:
          type: string
          description: The tool source this enablement applies to.
          readOnly: true
        tools:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1Tool"
          description: |-
            Enabled tools with their descriptor snapshots. Order is not
            significant.
      description: |-
        Which tools from one source are enabled for the agent or thread.

        The source describes what tools exist; the enablement describes what
        is turned on. An absent enablement (or an empty `tools` list) means no
        tools from that source are exposed to the LLM.
    agentsAgentServiceDuplicateAgentBody:
      type: object
      properties:
        name:
          type: string
          description: |-
            Optional name for the copy. Fails with ALREADY_EXISTS when the name's
            derived ID is taken. When omitted, defaults to "Copy of {source_name}",
            numbered "Copy of {source_name} (2)", "(3)", ... until the ID is free.
      description: Request message for DuplicateAgent.
    agentsV1CreateAgentRequest:
      type: object
      properties:
        name:
          type: string
          description: |-
            Required. The display name for the new agent.
            The agent ID will be derived from this name (lowercase, dashed).
      description: |-
        Request to create a new agent.

        The agent is created with an empty template (no generator, no tools, no
        memory blocks, no variables). The agent is queryable but not runnable
        until a thread sets the desired configuration as overrides and deploys
        to produce a new version.
    agentsV1SendToolResultResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: Whether the tool result was accepted and generation resumed.
      description: Response from sending a tool result.
    agentsV1ThreadStats:
      type: object
      properties:
        model:
          type: string
          description: |-
            The latest model the thread generated on (e.g. "claude-opus-4-8").
            Absent when the thread has never generated.
          readOnly: true
        provider:
          type: string
          description: |-
            Generator kind of the latest model (e.g. "anthropic"), used to resolve
            the model badge glyph. Absent when the thread has never generated.
          readOnly: true
        total_tokens:
          type: string
          format: uint64
          description: Total tokens across every billing class of the thread's usage.
          readOnly: true
        tool_calls:
          type: string
          format: uint64
          description: Tool calls the thread has issued.
          readOnly: true
        errors:
          type: string
          format: uint64
          description: |-
            Thread-level failures: terminal generation failures and plan executions
            that did not complete.
          readOnly: true
        recent_activity:
          type: array
          items:
            type: integer
            format: int64
          description: |-
            Recent per-generation total token counts, oldest first, bounded to the
            most recent generations. Rendered as the activity sparkline.
          readOnly: true
      description: |-
        Display aggregates for a thread, projected from its usage aggregate at
        listing time. Drives the monitoring-style thread card: the model badge,
        the tool/error/token strip, and the activity sparkline.
    agentsThreadServiceRestoreEventBody:
      type: object
      properties:
        event_id:
          type: string
          format: uint64
      description: |-
        Restores a previously deleted event and its entire associated turn.
        The event_id must refer to the InputText event that was previously deleted.
        All events in the turn are restored.
        Returns NOT_FOUND if no deleted turn starts at the given event_id.
    agentsV1Plan:
      type: object
      properties:
        name:
          type: string
          description: Name of the plan.
        description:
          type: string
          description: Description of the plan.
        active:
          type: boolean
          description: Whether the plan is currently active.
        phases:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1Phase"
          description: Ordered list of phases in this plan.
      description: A structured plan with phases and steps.
    agentsV1GrepArtifactsResponse:
      type: object
      properties:
        pattern:
          type: string
          description: The pattern that was searched.
        match_count:
          type: integer
          format: int64
          description: Total number of matches found (may exceed matches size if limited).
        matches:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1GrepMatch"
          description: The matches (may be limited by request limit).
      description: Response for GrepArtifacts.
    agentsV1Tool:
      type: object
      properties:
        id:
          type: string
          description: |-
            Globally unique, stable tool identifier (hash of the original tool name).
            Use this to target a tool in requests. Remains constant even when the
            tool is renamed via adapters.
          readOnly: true
        name:
          type: string
          description: |-
            Human-facing display name. May change due to adapters.
            Do not use for lookup, routing, or invocation — use `id` instead.
          readOnly: true
        description:
          type: string
          description: Human-readable description of what the tool does.
          readOnly: true
        source_id:
          type: string
          description: |-
            The source that provides this tool. Can be used as a performance hint
            in requests to limit search scope.
          readOnly: true
        is_adapted:
          type: boolean
          description: Whether this tool has been adapted (has adapters applied).
          readOnly: true
        original_name:
          type: string
          description: The original tool name (before any adaptations, if different).
          readOnly: true
        original_description:
          type: string
          description: The original description (before any adaptations).
          readOnly: true
        status_template:
          type: string
          description: |-
            Optional status template for UI display during tool execution.
            Supports argument interpolation using ${arg} or $arg syntax.
            Example: "Reading ${uri}" becomes "Reading /path/to/file.txt".
          readOnly: true
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1ToolParameter"
          description: Typed parameters for this tool (adapted version, as seen by LLM).
          readOnly: true
        output:
          $ref: "#/components/schemas/agentsV1ValueTypeDescriptor"
        is_remote:
          type: boolean
          description: |-
            Whether the tool requires remote execution. When true, generation
            pauses on each call and waits for an external result via the
            SendToolResult API. Reflects the effective (post-adapter) value.
          readOnly: true
        requires_approval:
          type: boolean
          description: |-
            Whether the tool requires explicit user approval before each call.
            When true, the agent loop pauses on the tool call and waits for the
            user to Approve or Deny. Reflects the effective (post-adapter) value.
          readOnly: true
        initial_window_seconds:
          type: integer
          format: int64
          description: |-
            How many seconds an unclaimed remote call has to be answered before it is
            closed out, zero meaning it never expires. Only meaningful when is_remote
            is true. Reflects the effective (post-adapter) value.
          readOnly: true
        lease_window_seconds:
          type: integer
          format: int64
          description: |-
            How many seconds a claim holds a remote call open past each renewal, zero
            meaning it never expires. Only meaningful when is_remote is true.
            Reflects the effective (post-adapter) value.
          readOnly: true
        execution_window_seconds:
          type: integer
          format: int64
          description: |-
            How many seconds a local call may run before it is abandoned and reported
            as a timeout, zero meaning it is never abandoned. Only meaningful when
            is_remote is false. Reflects the effective (post-adapter) value.
          readOnly: true
      description: A tool that can be called by an AI agent.
    agentsV1GetAgentResponse:
      type: object
      properties:
        id:
          type: string
          description: The agent's unique identifier.
        name:
          type: string
          description: The agent's display name.
        variables:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1VariableDefinition"
          description: |-
            Variable definitions for thread-scoped configuration.
            Variables can be referenced in any config using `$varName` syntax.
        sub_agents:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1SubAgent"
          description: Sub-agents configured for this agent.
        description:
          type: string
          description: Optional description of the agent's purpose.
        version:
          type: string
          format: uint64
          description: |-
            The version number of the returned agent. When loaded by tag or version,
            this is the resolved version. When loaded as latest, this is the latest version.
        tags:
          type: array
          items:
            type: string
          description: Tags applied to the returned version.
        auto_title_enabled:
          type: boolean
          description: |-
            Whether the agent automatically generates a title and description for
            each new thread on the first user message.
        customization_explainer_enabled:
          type: boolean
          description: |-
            Whether the agent generates a plain-English summary every time a
            thread's customization changes. The summaries are surfaced in the
            customization badge tooltip.
        abilities:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1Ability"
          description: The agent's abilities, as shown on the agent card.
        icon:
          type: string
          description: |-
            The agent's effective icon, as a kebab-case Lucide icon name. Empty
            when the agent has no icon.
      description: Response message for GetAgent.
    agentsV1ToolApprovalReply:
      type: object
      properties:
        tool_call_id:
          type: string
          description: The tool_call_id from the ToolApprovalRequested event.
        approved:
          type: boolean
          description: True for approval, false for denial.
        reason:
          type: string
          description: Optional reason. Populated on denial; ignored on approval.
      description: |-
        User's reply to a pending tool-approval request.
        Posted via SendMessageSync when the user clicks Approve or Deny on the
        approval card. The handler appends ToolApprovalGranted or
        ToolApprovalDenied to the thread event log and re-enters the agent
        loop.
    agentsThreadServiceGrepArtifactsBody:
      type: object
      properties:
        pattern:
          type: string
          description: Required. Regex pattern to search for.
        prefix:
          type: string
          description: Optional. URI prefix to limit search scope (e.g., "workspace://src/").
        glob:
          type: string
          description: Optional. Glob pattern to filter files (e.g., "*.rs").
        ignore_case:
          type: boolean
          description: Optional. Case-insensitive search.
        context_lines:
          type: integer
          format: int64
          description: Optional. Number of context lines before/after each match.
        limit:
          type: integer
          format: int64
          description: Optional. Maximum number of matches to return.
      description: Request for GrepArtifacts.
      required:
        - pattern
    agentsThreadServiceCommitArtifactsBody:
      type: object
      properties:
        prefix:
          type: string
          description: |-
            Optional. Store prefix to limit commit scope (e.g., "workspace://").
            If not specified, commits all staged changes across all stores.
      description: Request for CommitArtifacts.
    agentsThreadServiceStartCompactionBody:
      type: object
      properties:
        from_event_id:
          type: string
          format: uint64
          description: |-
            Optional. The event ID from which to start compaction.
            Events from this ID onwards (inclusive) will be compacted.
            If not specified, the entire conversation is compacted.
      description: |-
        Request to start context compaction for a thread.

        Compaction summarizes conversation history to reduce context size while
        preserving essential information. A CompactStart event is emitted immediately,
        and an external compaction process should later emit CompactComplete with the
        summary.
    agentsV1StepStatus:
      type: string
      enum:
        - STEP_STATUS_UNSPECIFIED
        - STEP_STATUS_PENDING
        - STEP_STATUS_COMPLETED
        - STEP_STATUS_FAILED
        - STEP_STATUS_SKIPPED
      default: STEP_STATUS_UNSPECIFIED
      description: |-
        Status of a plan step.

         - STEP_STATUS_UNSPECIFIED: Unspecified step status.
         - STEP_STATUS_PENDING: Step has not started yet.
         - STEP_STATUS_COMPLETED: Step completed successfully.
         - STEP_STATUS_FAILED: Step failed.
         - STEP_STATUS_SKIPPED: Step was skipped.
    agentsV1GetArtifactsStagingSummaryResponse:
      type: object
      properties:
        staging_enabled:
          type: boolean
          description: Whether staging is enabled for any stores.
        changes:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1StagedChange"
          description: List of staged changes (metadata only, no diff content).
        total_changes:
          type: integer
          format: int64
          description: Total number of staged changes.
        additions:
          type: integer
          format: int64
          description: Number of additions.
        modifications:
          type: integer
          format: int64
          description: Number of modifications.
        deletions:
          type: integer
          format: int64
          description: Number of deletions.
      description: Response for GetArtifactsStagingSummary.
    agentsAgentServiceExportAgentBody:
      type: object
      properties:
        format:
          type: string
          description: Required. The export format kind (e.g., "yaml", "kubernetes").
        config:
          type: object
          description: Format-specific configuration options.
      description: Request message for ExportAgent.
      required:
        - format
    agentsThreadServiceSetFeedbackBody:
      type: object
      properties:
        generation_id:
          type: string
          description: Required. The generation ID (from GenerationComplete.id).
        feedback_type:
          $ref: "#/components/schemas/agentsV1FeedbackType"
      description: Request to set feedback for a generation response.
    agentsV1ListArtifactsResponse:
      type: object
      properties:
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1Artifact"
          description: Artifacts matching the filter.
        common_prefixes:
          type: array
          items:
            type: string
          description: Common prefixes ("folders") when delimiter is set.
      description: Response for ListArtifacts.
    agentsV1Artifact:
      type: object
      properties:
        id:
          type: string
          description: "Unique identifier (URI format: {store_id}://{path})."
          readOnly: true
        name:
          type: string
          description: Path-based name (e.g., "src/main.rs", "docs/design.md").
          readOnly: true
        mime_type:
          type: string
          description: MIME type (e.g., "text/plain", "application/json", "image/png").
          readOnly: true
        size:
          type: string
          format: uint64
          description: Size in bytes.
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation timestamp.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last modification timestamp.
          readOnly: true
        description:
          type: string
          description: Optional description.
        version:
          type: string
          format: uint64
          description: Optimistic concurrency version (epoch nanoseconds).
          readOnly: true
      description: An artifact stored in an artifact store.
    agentsThreadServiceDeactivatePlanBody:
      type: object
      properties: {}
      description: Request to deactivate a thread's plan.
    agentsV1ListSubAgentsResponse:
      type: object
      properties:
        sub_agents:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1SubAgent"
          description: The sub-agents configured for the thread.
        is_customized:
          type: boolean
          description: Whether this represents a per-thread customization (vs inherited from agent).
      description: Response message for ListSubAgents.
    agentsThreadServiceUpdateThreadBody:
      type: object
      properties:
        title:
          type: string
          description: Optional new title for the thread.
        description:
          type: string
          description: Optional new description for the thread.
      description: Request to update a thread's metadata.
    agentsThreadServiceSendToolCallBody:
      type: object
      properties:
        tool_name:
          type: string
          description: Required. Tool name as advertised by the agent's tool catalog.
        arguments:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/agentsV1Value"
          description: |-
            Arguments to the tool, keyed by parameter name. Each Value carries the
            typed argument exactly as a generator would have produced it.
      description: |-
        Request to inject a deterministic tool call into a thread.

        Appends an assistant-voice preamble announcing the call as an externally
        requested action, then a synthetic ToolCallStart (and one ToolCallArgument
        per supplied argument) to the thread event log under the generation lock,
        executes the tool through the normal dispatcher, and continues with an LLM
        turn that has the tool result in context. The preamble keeps the model
        from misattributing the call to itself.
    agentsThreadServiceResetPlanBody:
      type: object
      properties: {}
      description: Request to reset all steps in a thread's plan back to pending.
    agentsV1ToolSource:
      type: object
      properties:
        source_id:
          type: string
          description: |-
            The unique source identifier. Generated unless the creator supplied
            one, as client-declared capabilities do (`client:<capability>`).
          readOnly: true
        type:
          type: string
          description: The source type (e.g., "rust", "grpc", "memory").
          readOnly: true
        display_name:
          type: string
          description: Human-readable label for the source type.
          readOnly: true
        description:
          type: string
          description: Description of this tool source.
          readOnly: true
        config:
          type: object
          description: The current configuration of this source.
          readOnly: true
        tool_adapters:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/agentsV1ToolAdapterChain"
          description: |-
            Per-tool adapter chains.
            Key is tool ID (stable hash of original tool name), value is the ordered chain of adapters.
            Adapters are applied in order: first adapter wraps the tool,
            second adapter wraps the first, etc.
      description: A configured tool source belonging to an agent.
    agentsThreadServiceCreateThreadBody:
      type: object
      properties:
        title:
          type: string
          description: Optional human-readable title for the thread.
        description:
          type: string
          description: Optional description of the thread's purpose or context.
        variables:
          type: object
          additionalProperties:
            type: string
          description: |-
            Variables for thread-scoped configuration resolution.
            These values fill the variables defined in the agent's configuration.
      description: Request to create a new thread.
    agentsV1GetArtifactDiffResponse:
      type: object
      properties:
        has_changes:
          type: boolean
          description: Whether this artifact has staged changes.
        change:
          $ref: "#/components/schemas/agentsV1StagedChange"
        diff:
          type: string
          description: |-
            Unified diff content.
            Empty for binary files, deleted artifacts, or if no changes.
      description: Response for GetArtifactDiff.
    agentsV1ExportAgentResponse:
      type: object
      properties:
        data:
          type: string
          format: byte
          description: The exported agent data.
        filename:
          type: string
          description: Suggested filename for the export (e.g., "my-agent.yaml").
        content_type:
          type: string
          description: MIME type of the exported data (e.g., "application/x-yaml").
      description: Response message for ExportAgent.
    agentsV1ListAgentsResponse:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1AgentDescriptor"
          description: The agents on this page, with their metadata.
        total_size:
          type: integer
          format: int32
          description: |-
            Total agents matching the parent scope AND query AND filter, across all
            pages.
        order_by:
          type: string
          description: |-
            The order applied to this page, normalised (e.g. "updated_at desc").
            The surface default when the request left `order_by` empty.
      description: Response message for ListAgents.
    agentsV1RestoreAgentVersionResponse:
      type: object
      properties:
        version:
          $ref: "#/components/schemas/agentsV1AgentVersionInfo"
      description: Response after restoring a previous agent version.
    agentsV1Event:
      type: object
      properties:
        id:
          type: string
          format: uint64
          description: |-
            Sequence ID within the thread (0-indexed).
            Used for SSE Last-Event-ID reconnection support.
            Only present when events are retrieved from a thread context.
        task_id:
          type: string
          description: |-
            Scopes this event to a sub-agent task.
            Not set for parent (top-level) scope events.
        recorded_at_ms:
          type: string
          format: int64
          description: |-
            Wall-clock time the event was recorded (appended to the store), in
            milliseconds since the Unix epoch. Present for persisted events; absent
            for ephemeral (id-less) notifications. Consumers derive a thread's
            status-change time from this recorded time.
        deleted:
          type: boolean
          description: |-
            Whether this event belongs to a deleted turn.
            Only set when include_deleted is true in the request.
        instruction_text:
          $ref: "#/components/schemas/agentsV1InstructionText"
        input_text:
          $ref: "#/components/schemas/agentsV1InputText"
        input_image:
          $ref: "#/components/schemas/agentsV1InputImage"
        output_text:
          $ref: "#/components/schemas/agentsV1OutputText"
        tool_call_start:
          $ref: "#/components/schemas/agentsV1ToolCallStart"
        tool_call_argument:
          $ref: "#/components/schemas/agentsV1ToolCallArgument"
        tool_result:
          $ref: "#/components/schemas/agentsV1ToolResult"
        generation_complete:
          $ref: "#/components/schemas/agentsV1GenerationComplete"
        reasoning_text:
          $ref: "#/components/schemas/agentsV1ReasoningText"
        reasoning_summary:
          $ref: "#/components/schemas/agentsV1ReasoningSummary"
        generation_failed:
          $ref: "#/components/schemas/agentsV1GenerationFailed"
        interrupt:
          $ref: "#/components/schemas/agentsV1Interrupt"
        interrupt_answer:
          $ref: "#/components/schemas/agentsV1InterruptAnswer"
        compact_start:
          $ref: "#/components/schemas/agentsV1CompactStart"
        compact_complete:
          $ref: "#/components/schemas/agentsV1CompactComplete"
        compact_failed:
          $ref: "#/components/schemas/agentsV1CompactFailed"
        reminder:
          $ref: "#/components/schemas/agentsV1Reminder"
        input_document:
          $ref: "#/components/schemas/agentsV1InputDocument"
        task_requested:
          $ref: "#/components/schemas/agentsV1TaskRequested"
        task_completed:
          $ref: "#/components/schemas/agentsV1TaskCompleted"
        task_failed:
          $ref: "#/components/schemas/agentsV1TaskFailed"
        follow_up:
          $ref: "#/components/schemas/agentsV1FollowUp"
        tool_approval_requested:
          $ref: "#/components/schemas/agentsV1ToolApprovalRequested"
        tool_approval_granted:
          $ref: "#/components/schemas/agentsV1ToolApprovalGranted"
        tool_approval_denied:
          $ref: "#/components/schemas/agentsV1ToolApprovalDenied"
        sleep_requested:
          $ref: "#/components/schemas/agentsV1SleepRequested"
        sleep_completed:
          $ref: "#/components/schemas/agentsV1SleepCompleted"
        transfer_requested:
          $ref: "#/components/schemas/agentsV1TransferRequested"
        transfer_completed:
          $ref: "#/components/schemas/agentsV1TransferCompleted"
        transfer_failed:
          $ref: "#/components/schemas/agentsV1TransferFailed"
        task_started:
          $ref: "#/components/schemas/agentsV1TaskStarted"
        task_suspended:
          $ref: "#/components/schemas/agentsV1TaskSuspended"
        task_resumed:
          $ref: "#/components/schemas/agentsV1TaskResumed"
        sleep_failed:
          $ref: "#/components/schemas/agentsV1SleepFailed"
        events_deleted:
          $ref: "#/components/schemas/agentsV1EventsDeleted"
        event_enqueued:
          $ref: "#/components/schemas/agentsV1EventEnqueued"
        event_popped:
          $ref: "#/components/schemas/agentsV1EventPopped"
        input_artifact:
          $ref: "#/components/schemas/agentsV1InputArtifact"
      description: |-
        An event in a generation sequence.

        Events represent all occurrences during generation, both from input
        (instructions, prompts, tool results) and output (generated text,
        tool calls, generation metadata).
    agentsV1AgentVersionInfo:
      type: object
      properties:
        version:
          type: string
          format: uint64
          description: Auto-incrementing version number (1-based).
        tags:
          type: array
          items:
            type: string
          description: User-applied tags on this version.
        created_at:
          type: string
          format: date-time
          description: When this version was created.
        created_by:
          $ref: "#/components/schemas/agentsV1PrincipalRef"
      description: Metadata for a single stored version of an agent.
    agentsThreadServiceSendMessageSyncBody:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/agentsV1UserMessage"
        interrupt_reply:
          $ref: "#/components/schemas/agentsV1InterruptReply"
        tool_approval_reply:
          $ref: "#/components/schemas/agentsV1ToolApprovalReply"
      description: Request to send a message and stream response events synchronously.
    agentsV1ThreadOrigin:
      type: object
      properties:
        kind:
          type: string
          description: |-
            Stable discriminator equal to the set `detail` arm's name
            ("schedule", "sub_agent", ...). Lets generic clients and filters
            switch on the kind without knowing every variant.
        schedule:
          $ref: "#/components/schemas/agentsV1ScheduleOrigin"
        sub_agent:
          $ref: "#/components/schemas/agentsV1SubAgentOrigin"
      description: |-
        Why a thread was created. Absent on a thread means it was started
        directly (the normal interactive flow). New kinds are added as
        additional `detail` arms without breaking existing ones.
    agentsV1ToolParameter:
      type: object
      properties:
        name:
          type: string
          description: The parameter name.
          readOnly: true
        description:
          type: string
          description: Human-readable description of the parameter.
          readOnly: true
        value_type:
          $ref: "#/components/schemas/agentsV1ValueTypeDescriptor"
        required:
          type: boolean
          description: Whether this parameter is required.
          readOnly: true
      description: A tool parameter with semantic type information.
    agentsV1CompactFailed:
      type: object
      properties:
        compact_id:
          type: string
          description: Unique identifier linking to CompactStart.
        message:
          type: string
          description: Human-readable error message.
      description: Marks the failure of a compaction operation.
    agentsV1UserMessage:
      type: object
      properties:
        content:
          type: string
          description: The message text content.
        images:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1UserImage"
          description: Optional images to include with the message.
        documents:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1UserDocument"
          description: Optional documents to include with the message.
      description: A user message with optional attachments.
    agentsV1InstructionText:
      type: object
      properties:
        text:
          type: string
          description: The instruction text.
        mutable:
          type: boolean
          description: |-
            Whether the text is expected to change between turns (e.g. a writable
            memory block). Generators that support prompt caching use this to keep
            volatile content outside the cached prefix.
        id:
          type: string
          description: |-
            Stable identifier when the instruction comes from a named source
            (e.g. a memory block id). Unset for freeform instructions.
      description: |-
        Instruction text providing context or directives.
        Typically appears at the beginning to set generator behavior.
    agentsV1UserImage:
      type: object
      properties:
        uri:
          type: string
          description: URI or data URI of the image.
        detail:
          type: string
          description: Level of detail for image processing (optional).
      description: An image attached to a user message.
    agentsV1TaskRequested:
      type: object
      properties:
        call_id:
          type: string
          title: |-
            The invoke_agent_* tool-call id. The recording-stable handle the LLM uses
            to address the task on resume. (No task_id yet — the sub-thread does not
            exist until TaskStarted.)
        sub_agent_id:
          type: string
          description: The configured sub-agent ID to invoke.
        input:
          type: string
          description: The message/input to send to the sub-agent.
        artifacts:
          type: array
          items:
            type: string
          description: Artifact URIs to hand to the sub-agent, materialized into its uploads.
        variables:
          type: object
          additionalProperties:
            type: string
          description: Per-invocation values for the target agent's exposed variables.
        opaque:
          type: string
          format: byte
          description: Provider-specific opaque blob for faithful replay (e.g. Gemini thought_signature).
      description: Sub-agent invocation requested by the LLM.
    agentsV1ToolApprovalGranted:
      type: object
      properties:
        tool_call_id:
          type: string
          description: The tool_call_id from the corresponding ToolApprovalRequested event.
      description: |-
        User granted approval for a pending tool call.
        Resume scan dispatches the tool when this event is present without a
        matching ToolResult.
    agentsV1Value:
      type: object
      properties:
        string_value:
          type: string
          description: A string value.
        number_value:
          type: number
          format: double
          description: A floating-point number.
        integer_value:
          type: string
          format: int64
          description: An integer.
        bool_value:
          type: boolean
          description: A boolean.
        binary_value:
          type: string
          format: byte
          description: Raw binary data.
        artifact_value:
          $ref: "#/components/schemas/agentsV1ArtifactValue"
        artifact_uri_value:
          $ref: "#/components/schemas/agentsV1ArtifactUriValue"
        date_value:
          $ref: "#/components/schemas/agentsV1DateValue"
        time_value:
          $ref: "#/components/schemas/agentsV1TimeValue"
        date_time_value:
          $ref: "#/components/schemas/agentsV1DateTimeValue"
        duration_value:
          $ref: "#/components/schemas/agentsV1DurationValue"
        list_value:
          $ref: "#/components/schemas/agentsV1ListValue"
        object_value:
          $ref: "#/components/schemas/agentsV1ObjectValue"
        null_value:
          $ref: "#/components/schemas/agentsV1NullValue"
      description: |-
        A typed runtime value.

        Mirrors rain_value::Value — carries both the data and enough metadata
        (mime_type, filename) for consumers to handle it correctly.
    agentsV1FollowUp:
      type: object
      properties:
        suggestion:
          type: string
          description: The suggested follow-up message text.
      description: |-
        A streamed follow-up suggestion chip.
        Ephemeral: not persisted, only streamed to SSE clients.
    agentsV1ResetEventsResponse:
      type: object
      description: Response for ResetEvents.
    agentsV1GetEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1Event"
          description: The events in the thread, ordered chronologically.
      description: Response message for GetEvents.
    agentsV1DiffArtifactsResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1DiffEntry"
          description: List of staged changes with optional diff content.
        total_changes:
          type: integer
          format: int64
          description: Total number of staged changes.
        additions:
          type: integer
          format: int64
          description: Number of additions.
        modifications:
          type: integer
          format: int64
          description: Number of modifications.
        deletions:
          type: integer
          format: int64
          description: Number of deletions.
      description: Response for DiffArtifacts.
    agentsV1ListThreadsResponse:
      type: object
      properties:
        threads:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1Thread"
          description: The threads for the agent.
      description: Response message for ListThreads.
    agentsV1AgentDescriptor:
      type: object
      properties:
        id:
          type: string
          description: The agent's unique identifier.
        name:
          type: string
          description: The agent's display name.
        description:
          type: string
          description: Optional description of the agent's purpose.
        read_only:
          type: boolean
          description: Whether this agent is read-only (e.g. the default agent).
        latest_version:
          type: string
          format: uint64
          description: Latest version number, if the store supports versioning.
        latest_tags:
          type: array
          items:
            type: string
          description: Tags applied to the latest version.
        last_updated_at:
          type: string
          format: date-time
          description: When the latest version was created (last update time).
        created_by:
          $ref: "#/components/schemas/agentsV1PrincipalRef"
        updated_by:
          $ref: "#/components/schemas/agentsV1PrincipalRef"
        created_at:
          type: string
          format: date-time
          description: When the agent was created (first save).
        rating:
          type: number
          format: double
          description: |-
            Aggregated user-feedback rating in [0, 1] (Wilson lower bound), projected
            to the latest version. Absent when no feedback has been recorded.
        abilities:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1Ability"
          description: |-
            The agent's abilities, as shown on the agent card. Empty when the
            agent has no abilities.
        icon:
          type: string
          description: |-
            The agent's icon, as a kebab-case Lucide icon name. Empty when the
            agent has no icon.
        stats:
          type: object
          additionalProperties:
            type: string
          description: |-
            Derived, presentational metadata about the agent, e.g.
            {"model": "gpt-4o", "generator_kind": "openai", "tool_count": "12",
            "context_window": "128000"}. Keys are open-ended; clients read the
            ones they recognize and ignore the rest. Values are strings; numeric
            values are stringified. A key is absent when it has no value for the
            agent (e.g. an agent with no fixed model omits "model").
        has_plan:
          type: boolean
          description: |-
            Whether the agent defines a base plan. A promptless schedule requires
            one (each run executes the plan), so clients gate that affordance on it.
        labels:
          type: array
          items:
            type: string
          description: |-
            Freeform labels describing the agent as a whole, e.g. "finance",
            "internal-tool". Unlike `latest_tags`, which names one immutable
            version, these belong to the agent and do not change as versions come
            and go.
      description: Descriptor for an agent with basic metadata.
    agentsAgentServiceTagAgentVersionBody:
      type: object
      properties:
        tag:
          type: string
          description: The tag name to apply.
      description: Request to apply a tag to a specific agent version.
    agentsV1Interrupt:
      type: object
      properties:
        interrupt_id:
          type: string
          description: Unique identifier for this interrupt (for correlating reply).
        questions:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1InterruptQuestion"
          description: The questions to ask the user.
        opaque:
          type: string
          format: byte
          description: |-
            Provider-specific opaque data required for multi-turn replay.
            Gemini: the thoughtSignature from the ask_user function call.
      description: |-
        Generation paused - LLM is asking the user question(s).
        This is a terminal event (like GenerationComplete) - no more events follow
        until the user responds.
    agentsThreadServiceForkThreadBody:
      type: object
      properties:
        title:
          type: string
          description: Optional title for the new thread. Defaults to "Fork of {source_title}".
      description: Request message for ForkThread (duplicate a thread with all its data).
    agentsV1CommitArtifactsResponse:
      type: object
      properties:
        committed_count:
          type: integer
          format: int64
          description: Number of artifacts committed.
        additions:
          type: integer
          format: int64
          description: Number of additions committed.
        modifications:
          type: integer
          format: int64
          description: Number of modifications committed.
        deletions:
          type: integer
          format: int64
          description: Number of deletions committed.
        version:
          type: string
          description: |-
            New artifact version produced by this commit, if the store versions its
            contents. Absent for stores without a version concept.
      description: Response for CommitArtifacts.
    agentsV1ArtifactUriValue:
      type: object
      properties:
        uri:
          type: string
        mime_type:
          type: string
        filename:
          type: string
      description: An artifact URI reference with optional metadata.
    agentsV1ToolApprovalRequested:
      type: object
      properties:
        tool_call_id:
          type: string
          description: The tool_call_id from the corresponding ToolCallStart event.
      description: |-
        Approval requested for a pending tool call.
        Emitted when a tool's requires_approval flag is true after the model
        emits the corresponding ToolCallStart. The agent loop pauses (turn
        returns interrupted) until a matching ToolApprovalGranted or
        ToolApprovalDenied event is appended to the thread.
    agentsV1WakeResponse:
      type: object
      properties:
        woken:
          type: boolean
          description: |-
            True if a pending sleep was found and ended early. False when the
            thread was not currently sleeping (the call still triggers a normal
            resume in that case, but no SleepCompleted is appended).
      description: Response for waking a sleeping thread.
    agentsV1DurationValue:
      type: object
      properties:
        seconds:
          type: string
          format: int64
        nanos:
          type: integer
          format: int32
      description: A duration in seconds and nanoseconds.
    agentsV1UpdateAgentResponse:
      type: object
      properties:
        id:
          type: string
          description: The agent's unique identifier.
        name:
          type: string
          description: The updated display name.
        description:
          type: string
          description: The updated description.
        version:
          type: string
          format: uint64
          description: |-
            The new version number, if a new version was created. None if the
            template was identical to the current latest version.
        labels:
          type: array
          items:
            type: string
          description: |-
            The agent's labels after the update, normalised: trimmed, de-duplicated,
            and re-cased to match any spelling already in use elsewhere. Always
            populated, whether or not the request carried labels, so a client can
            see what its input resolved to.
      description: Response message for UpdateAgent.
    agentsV1SleepCompleted:
      type: object
      properties:
        sleep_id:
          type: string
          description: Equal to the sleep_id of the matching SleepRequested.
        slept_for_seconds:
          type: string
          format: uint64
          description: How long we actually slept, in seconds.
        woke_at:
          type: string
          format: int64
          description: Wall-clock time we woke (Unix seconds).
        interrupted_by_user:
          type: boolean
          description: |-
            True when the sleep was cut short by a user message arriving while
            the thread was sleeping; false when the scheduled wake fired
            naturally.
      description: Sleep ended and the thread is being resumed.
    agentsAgentServiceUpdateAgentBody:
      type: object
      properties:
        name:
          type: string
          description: The new display name for the agent.
        labels:
          $ref: "#/components/schemas/agentsV1AgentLabels"
      description: |-
        Request to edit an agent's own identity.

        Renaming and relabelling are the only direct edits to a base agent — its
        description, abilities, and feature toggles are deployable configuration,
        edited on a thread and promoted by Deploy, never written here.
    agentsV1ToolCallStart:
      type: object
      properties:
        index:
          type: integer
          format: int32
          description: Index of this tool call (for parallel tool calls).
        id:
          type: string
          description: Unique identifier for this tool call.
        name:
          type: string
          description: Name of the tool being called.
        is_remote:
          type: boolean
          description: |-
            Whether this tool requires remote execution.
            Remote tools pause generation and wait for an external system
            to execute them and post the result back via API.
        status_template:
          type: string
          description: |-
            Optional status template for UI display during tool execution.
            Supports argument interpolation using ${arg} or $arg syntax.
            Example: "Reading ${uri}" becomes "Reading /path/to/file.txt".
        opaque:
          type: string
          format: byte
          description: |-
            Provider-specific opaque data required for multi-turn replay.
            Gemini: the thoughtSignature from function call parts.
      description: Tool call initiated by the generator.
    agentsV1ArtifactValue:
      type: object
      properties:
        data:
          type: string
          format: byte
        mime_type:
          type: string
        filename:
          type: string
      description: "An artifact value: binary data with optional metadata."
    agentsV1SleepRequested:
      type: object
      properties:
        sleep_id:
          type: string
          description: |-
            Correlation handle. Equal to the ScheduledTaskId registered with
            the scheduler, and equal to sleep_id echoed in the matching
            SleepCompleted.
        requested_at:
          type: string
          format: int64
          description: Wall-clock time the request was emitted (Unix seconds).
        wake_at:
          type: string
          format: int64
          description: Wall-clock time the wake is scheduled for (Unix seconds).
        seconds:
          type: integer
          format: int64
          description: Requested duration in seconds (post-clamp to the operator cap).
        reason:
          type: string
          description: Optional reason, copied through from the tool call arguments.
        opaque:
          type: string
          format: byte
          description: Provider-specific opaque data required for multi-turn replay.
      description: |-
        Generation paused — LLM called the synthetic `sleep` tool.
        Terminal event, like Interrupt. The agent runner schedules the wake
        and exits; resumption happens via SleepCompleted appended by the
        AgentWakeHandler (or by the message-receive path on user interrupt).
    agentsThreadServiceUpdateArtifactBody:
      type: object
      properties:
        mime_type:
          type: string
          description: Required. The MIME type.
        data:
          type: string
          format: byte
          description: Required. The artifact content.
        description:
          type: string
          description: Optional description.
      description: Request for UpdateArtifact.
      required:
        - mime_type
        - data
    agentsThreadServiceDeleteEventBody:
      type: object
      properties:
        event_id:
          type: string
          format: uint64
      description: |-
        Deletes an event and its entire associated turn from the thread.
        The event_id must refer to an InputText event that starts a turn.
        This deletes all events in the turn: the initiating InputText, all generation output
        (text, tool calls, tool results, reasoning, interrupts and their answers), and
        terminal events (GenerationComplete/GenerationFailed) through all generation cycles
        until the next InputText event.
        Returns INVALID_ARGUMENT if event_id does not refer to an InputText event.
    agentsV1TaskResumed:
      type: object
      properties:
        task_id:
          type: string
          description: The delegate's sub-thread id being resumed.
        call_id:
          type: string
          description: The resume_agent tool-call id.
        answers:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1QuestionAnswer"
          description: The answers to the delegate's questions.
        opaque:
          type: string
          format: byte
          description: Provider-specific opaque blob (e.g. Gemini thought_signature).
      description: The parent answered a suspended delegate (the resume_agent tool call).
    agentsV1FeedbackType:
      type: string
      enum:
        - FEEDBACK_TYPE_UNSPECIFIED
        - FEEDBACK_TYPE_LIKE
        - FEEDBACK_TYPE_DISLIKE
      default: FEEDBACK_TYPE_UNSPECIFIED
      description: |-
        Feedback type for a generation response.

         - FEEDBACK_TYPE_UNSPECIFIED: No feedback has been provided.
         - FEEDBACK_TYPE_LIKE: User liked the response.
         - FEEDBACK_TYPE_DISLIKE: User disliked the response.
    agentsV1ThreadStatus:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/agentsV1ThreadStatusState"
        tool_label:
          type: string
          description: "ExecutingTool: the tool's rendered in-flight label."
        remote_count:
          type: integer
          format: int64
          description: "AwaitingTool: the number of open remote calls (>= 1)."
        wake_at:
          type: string
          format: date-time
          description: "Sleeping: the scheduled wake instant."
        sleep_reason:
          type: string
          description: "Sleeping: optional reason copied from the sleep request."
        retry_attempt:
          type: integer
          format: int64
          description: "Retrying: 1-indexed attempt number."
        retry_max_attempts:
          type: integer
          format: int64
          description: "Retrying: total attempts permitted."
        next_attempt_at:
          type: string
          format: date-time
          description: "Retrying: when the next attempt is scheduled, if known."
        error_kind:
          $ref: "#/components/schemas/agentsV1GenerationErrorKind"
        error_message:
          type: string
          description: "Failed: human-readable error message."
      description: |-
        What a thread is doing right now. A point-in-time field that changes many
        times within a single turn; a pure function of the thread's event history.
    agentsV1InterruptQuestion:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this question.
        question:
          type: string
          description: The full question text.
        header:
          type: string
          description: Short label displayed as chip/tag (max 12 chars).
        options:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1InterruptOption"
          description: Available choices (2-4 options).
        multi_select:
          type: boolean
          description: If true, user can select multiple options.
      description: A single question in an interrupt.
    agentsV1Phase:
      type: object
      properties:
        name:
          type: string
          description: Name of the phase.
        description:
          type: string
          description: Description of the phase.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1Step"
          description: Ordered list of steps in this phase.
      description: A phase containing ordered steps.
    agentsV1DehydrationState:
      type: object
      properties:
        dehydrated_at:
          type: string
          format: date-time
          description: When the thread was dehydrated.
        dehydrated_by:
          $ref: "#/components/schemas/agentsV1PrincipalRef"
        size_bytes:
          type: string
          format: uint64
          description: Size of the archive in bytes.
      description: |-
        Operational dehydration lifecycle state for a thread. Present iff the thread
        has been dehydrated (its data archived, leaving a tombstone). The archive's
        storage internals are server-side only; clients see just when and by whom the
        thread was dehydrated and how large the archive is.
    agentsThreadServiceDiscardArtifactsBody:
      type: object
      properties: {}
      description: Request for DiscardArtifacts.
    agentsV1GetThreadContextResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1ContextItem"
          description: List of context items contributing to the thread's context window.
          readOnly: true
        model_info:
          $ref: "#/components/schemas/agentsV1ModelInfo"
        summary:
          $ref: "#/components/schemas/agentsV1ContextSummary"
        auto_compact_tokens:
          type: integer
          format: int64
          description: |-
            Prompt token count at which the next completed turn triggers
            auto-compaction.

            Absent when no compactor is configured, in which case auto-compaction
            never fires, or when the model does not report a context window.
          readOnly: true
      description: Response containing thread context information.
    agentsV1ToolApprovalDenied:
      type: object
      properties:
        tool_call_id:
          type: string
          description: The tool_call_id from the corresponding ToolApprovalRequested event.
        reason:
          type: string
          description: Optional reason supplied by the user when denying.
      description: |-
        User denied approval for a pending tool call.
        Resume scan synthesizes a ToolResult with success=false and the
        reason in the error field when this event is present without a
        matching ToolResult.
    agentsV1QuestionAnswer:
      type: object
      properties:
        question_id:
          type: string
          description: The question ID being answered.
        selected:
          type: array
          items:
            type: string
          description: Selected option label(s). Multiple for multi_select questions.
      description: A single question's answer.
    agentsV1ListAgentVersionsResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1AgentVersionInfo"
          description: All versions in ascending order.
      description: Response containing the version history of an agent.
    agentsThreadServiceActivatePlanBody:
      type: object
      properties: {}
      description: Request to activate a thread's plan.
    agentsV1ToolAdapterChain:
      type: object
      properties:
        adapters:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1ToolAdapterDescriptor"
          description: List of adapters applied to this tool.
      description: |-
        A chain of adapters for a single tool.
        Adapters are applied in order: first adapter wraps the tool,
        second adapter wraps the first, etc.
    agentsV1DateValue:
      type: object
      properties:
        year:
          type: integer
          format: int32
        month:
          type: integer
          format: int32
        day:
          type: integer
          format: int32
      description: A date value with year, month, day components.
    agentsV1SetFeedbackResponse:
      type: object
      properties:
        feedback_type:
          $ref: "#/components/schemas/agentsV1FeedbackType"
        previous_feedback_type:
          $ref: "#/components/schemas/agentsV1FeedbackType"
      description: Response for setting feedback on a generation.
    agentsV1EventPopped:
      type: object
      properties:
        priority:
          $ref: "#/components/schemas/agentsV1QueuePriority"
        events:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1Event"
          description: The events forming the drained group, verbatim.
      description: |-
        The durable queue head was drained (enacted). Broadcast-only. Carries the
        drained group so subscribers can match-and-remove it.
    agentsV1GenerationFailed:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message.
        kind:
          $ref: "#/components/schemas/agentsV1GenerationErrorKind"
        retryable:
          type: boolean
          description: |-
            When `true`, the agent loop is automatically retrying this generation;
            the next attempt fires at `next_attempt_at`. When `false`, this is a
            terminal failure (either non-retryable by classification, or the
            retry budget is exhausted).
        attempt:
          type: integer
          format: int64
          description: |-
            1-indexed attempt number that this failure corresponds to. Zero when
            `retryable` is false and the field is unused.
        max_attempts:
          type: integer
          format: int64
          description: |-
            Total attempts permitted in this retry budget. Zero when `retryable`
            is false and the field is unused.
        next_attempt_at:
          type: string
          format: date-time
          description: |-
            Wall-clock instant at which the next attempt is scheduled. Absent
            when `retryable` is false.
        usage:
          $ref: "#/components/schemas/agentsV1Usage"
        model:
          type: string
          description: Model the failed attempt ran on, when known.
        provider:
          type: string
          description: Generator kind of the failed attempt, when known.
      description: |-
        Generation failed with an error.
        The error message should be displayed to the user.
    agentsToolCatalogServiceEnableToolsBody:
      type: object
      properties:
        tool_ids:
          type: array
          items:
            type: string
          description: |-
            Required. The tool IDs to enable (added to existing enabled set).
            Tool IDs are stable hashes of the original tool name.
      description: Request message for EnableTools (batch enable, additive).
      required:
        - tool_ids
    agentsV1RestoreEventResponse:
      type: object
      properties:
        from_event_id:
          type: string
          format: uint64
        to_event_id:
          type: string
          format: uint64
    agentsV1Step:
      type: object
      properties:
        name:
          type: string
          description: Name of the step.
        description:
          type: string
          description: Description of what needs to be done.
        acceptance_criteria:
          type: string
          description: Criteria for determining when the step is complete.
        status:
          $ref: "#/components/schemas/agentsV1StepStatus"
        failure_reason:
          type: string
          description: Reason for failure (only set when status is FAILED).
      description: A single step within a phase.
    agentsV1ListToolsResponse:
      type: object
      properties:
        tools:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1Tool"
          description: The tools available to the agent.
        is_customized:
          type: boolean
          description: |-
            Whether this represents a per-thread tool-level override. True
            when the flat (source, tool, name, adapters, metadata) view
            differs from the pinned agent version's tools. Independent of
            `ListToolSources.is_customized`, which only flags source-identity
            changes.
      description: Response message for ListTools.
    agentsThreadServiceDiffArtifactsBody:
      type: object
      properties:
        prefix:
          type: string
          description: |-
            Optional. Store prefix to limit diff scope (e.g., "workspace://").
            If not specified, returns diff for all stores.
        include_content:
          type: boolean
          description: |-
            Optional. Include unified diff content for each change.
            Default is false (summary only).
      description: Request for DiffArtifacts.
    agentsThreadServiceSendToolResultBody:
      type: object
      properties:
        tool_call_id:
          type: string
          description: Required. The ID of the tool call (from ToolCallStart.id).
        content:
          $ref: "#/components/schemas/agentsV1Value"
        success:
          type: boolean
          description: Whether the tool execution was successful.
        error:
          type: string
          description: |-
            Error message if the tool execution failed (optional).
            When set, success should be false.
        duration_micros:
          type: string
          format: uint64
          description: Duration of tool execution in microseconds (optional).
      description: |-
        Request to send a tool execution result for a remote tool.

        Remote tools pause generation when called, waiting for an external system
        to execute them and return the result via this RPC. Generation resumes
        once the result is received.
    agentsV1InputImage:
      type: object
      properties:
        uri:
          type: string
          description: URI or data URI of the image.
        detail:
          type: string
          description: Level of detail for image processing (optional).
      description: Input image for vision models.
    agentsV1VariableDefinition:
      type: object
      properties:
        name:
          type: string
          description: The variable name (used as `$name` in configs).
        required:
          type: boolean
          description: Whether this variable is required when creating a thread.
        default:
          type: string
          description: Default value if not provided (only valid for non-required variables).
        description:
          type: string
          description: Human-readable description of what this variable is for.
        segment:
          type: string
          description: |-
            URL path segment name for multi-tenant parent path routing.
            When set, this variable can be extracted from a parent path like
            `/organizations/acme/workspaces/dev` where `organizations` and `workspaces`
            are segment names. If not set, the variable `name` is used as the segment.
        fixed_value:
          type: string
          description: |-
            Fixed value for this variable.
            When set, the variable is locked to this value and cannot be overridden.
            Unlike `default` (which can be overridden), a fixed value is immutable.
      description: |-
        Defines a variable that can be used in agent configuration.

        Variables are defined at the agent level and filled when creating a thread.
        They can be referenced in any configuration value using `$varName` syntax.
    agentsV1ScheduleOrigin:
      type: object
      properties:
        schedule_id:
          type: string
          title: |-
            The schedule whose occurrence created this thread. (The owning agent
            is implied by the thread.)
        occurrence_at:
          type: string
          format: date-time
          description: The scheduled fire time this thread corresponds to.
      description: A thread created because a schedule occurrence fired.
    agentsV1TimeValue:
      type: object
      properties:
        hour:
          type: integer
          format: int32
        minute:
          type: integer
          format: int32
        second:
          type: integer
          format: int32
      description: A time value with hour, minute, second components.
    agentsV1TaskSuspended:
      type: object
      properties:
        task_id:
          type: string
          description: The delegate's sub-thread id.
        call_id:
          type: string
          description: The tool call this suspension resolves.
        interrupt_id:
          type: string
          description: The sub-thread ask_user interrupt awaiting an answer.
        questions:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1InterruptQuestion"
          description: The questions the delegate is asking.
      description: The delegate paused on an ask_user interrupt.
    agentsV1PrincipalRef:
      type: object
      properties:
        id:
          type: string
          description: |-
            Stable identifier. For OIDC this is the `sub` claim. For
            trusted-header mode this is the header configured as `user_id`.
            For `Fixed` mode it is the configured principal's id.
        kind:
          $ref: "#/components/schemas/agentsV1PrincipalKind"
        email:
          type: string
          description: |-
            Email address if known. Optional because some IdPs don't expose
            one (service accounts, machine identities).
        display_name:
          type: string
          description: |-
            Human-readable display name (`name` claim,
            `X-Forwarded-Preferred-Username`, configured display name in
            Fixed mode).
        component:
          type: string
          description: |-
            For `PRINCIPAL_KIND_SYSTEM`, the in-process component that owns
            this attribution (`"backfill"`, `"bootstrap"`, etc.).
      description: |-
        Persistence-shape subset of a Principal stamped on stored entities
        as `created_by` / `updated_by`.

        The full Principal (with raw claims and groups) only lives in
        memory for the duration of a request; `PrincipalRef` is what gets
        persisted on agents, threads, and scheduled-task payloads.
    agentsV1UserDocument:
      type: object
      properties:
        uri:
          type: string
          description: Data URI of the document.
        filename:
          type: string
          description: Original filename.
      description: A document attached to a user message.
    agentsV1DiffEntry:
      type: object
      properties:
        change:
          $ref: "#/components/schemas/agentsV1StagedChange"
        diff:
          type: string
          description: |-
            Unified diff content (only if include_content was true).
            Empty for binary files or deleted artifacts.
      description: A diff entry with optional content.
    agentsV1Cost:
      type: object
      properties:
        input_nano_usd:
          type: string
          format: uint64
          description: Fresh-input tokens priced at the input rate.
        cache_read_nano_usd:
          type: string
          format: uint64
          description: Cache reads priced at the cache-read rate.
        cache_write_nano_usd:
          type: string
          format: uint64
          description: Cache writes priced at their per-TTL rates.
        output_nano_usd:
          type: string
          format: uint64
          description: Output tokens priced at the output rate.
        total_nano_usd:
          type: string
          format: uint64
          description: Sum of the four classes.
        estimated:
          type: boolean
          description: |-
            Some component was priced through a loud fallback (missing cache
            rate, unknown cache-write TTL, legacy usage semantics, or an
            ambiguous rate-card lookup) — the figure is an estimate, not exact.
      description: |-
        A computed USD cost in integer nano-USD, per billing class.

        Never persisted — always computed on request from the effective-dated
        rate card, so rate corrections apply retroactively while the underlying
        token accounting stays immutable.
    agentsV1ValueTypeDescriptor:
      type: object
      properties:
        string_type:
          $ref: "#/components/schemas/agentsV1EmptyType"
        number_type:
          $ref: "#/components/schemas/agentsV1EmptyType"
        integer_type:
          $ref: "#/components/schemas/agentsV1EmptyType"
        boolean_type:
          $ref: "#/components/schemas/agentsV1EmptyType"
        binary_type:
          $ref: "#/components/schemas/agentsV1EmptyType"
        artifact_type:
          $ref: "#/components/schemas/agentsV1ArtifactValueType"
        artifact_uri_type:
          $ref: "#/components/schemas/agentsV1ArtifactValueType"
        literal_string_type:
          $ref: "#/components/schemas/agentsV1LiteralStringType"
        date_type:
          $ref: "#/components/schemas/agentsV1EmptyType"
        time_type:
          $ref: "#/components/schemas/agentsV1EmptyType"
        date_time_type:
          $ref: "#/components/schemas/agentsV1EmptyType"
        duration_type:
          $ref: "#/components/schemas/agentsV1EmptyType"
        list_type:
          $ref: "#/components/schemas/agentsV1ListType"
        object_type:
          $ref: "#/components/schemas/agentsV1ObjectType"
        dictionary_type:
          $ref: "#/components/schemas/agentsV1DictionaryType"
        optional_type:
          $ref: "#/components/schemas/agentsV1OptionalType"
        enum_type:
          $ref: "#/components/schemas/agentsV1EnumType"
        any_type:
          $ref: "#/components/schemas/agentsV1EmptyType"
        null_type:
          $ref: "#/components/schemas/agentsV1EmptyType"
        description:
          type: string
          description: Optional description of this value type.
      description: |-
        Semantic type descriptor for tool parameters and outputs.

        Represents the semantic meaning of a value type, enabling type-appropriate
        UI widgets beyond what raw JSON Schema can express.
    agentsV1TaskCompleted:
      type: object
      properties:
        task_id:
          type: string
          description: The delegate's sub-thread id (task identity).
        result:
          type: string
          description: Collected output text from the sub-agent.
        call_id:
          type: string
          description: The tool call this completion resolves (invoke or the last resume).
      description: Sub-agent invocation completed.
    agentsV1InputText:
      type: object
      properties:
        text:
          type: string
          description: The input text.
      description: Input text prompting the generator.
    agentsV1ReasoningSummary:
      type: object
      properties:
        text:
          type: string
          description: The reasoning summary text.
      description: |-
        Summary of the model's reasoning process.
        Only available with OpenAI Responses API for reasoning models.
    agentsV1ContextSummary:
      type: object
      properties:
        fixed_tokens:
          type: integer
          format: int64
          description: Tokens used by fixed context (immutable memory + tools).
          readOnly: true
        volatile_tokens:
          type: integer
          format: int64
          description: Tokens used by volatile context (mutable memory).
          readOnly: true
        compactable_tokens:
          type: integer
          format: int64
          description: Tokens used by compactable context (conversation).
          readOnly: true
        total_used_tokens:
          type: integer
          format: int64
          description: Total tokens currently in use.
          readOnly: true
        available_tokens:
          type: integer
          format: int64
          description: Tokens available before hitting the context limit.
          readOnly: true
      description: Summary of token usage by category.
    agentsV1GenerationComplete:
      type: object
      properties:
        usage:
          $ref: "#/components/schemas/agentsV1Usage"
        model:
          type: string
          description: Model that was used for generation.
        id:
          type: string
          description: Unique response identifier.
        agent_version:
          type: string
          format: uint64
          description: |-
            Agent version active when this generation ran. Absent for events written
            before this field existed (the rating update falls back to the thread's
            pinned version for those).
        provider:
          type: string
          description: |-
            Generator kind that produced this completion (e.g. "anthropic",
            "bedrock"), stamped by the agent loop so rate-card lookup is exact.
            Absent for events written before this field existed.
      description: |-
        Generation completed successfully.
        This is always the final event in both streaming and non-streaming modes.
    agentsV1GrepMatch:
      type: object
      properties:
        id:
          type: string
          description: Artifact ID containing the match.
          readOnly: true
        name:
          type: string
          description: Artifact name/path.
          readOnly: true
        line:
          type: integer
          format: int64
          description: Line number (1-indexed).
          readOnly: true
        content:
          type: string
          description: The matching line content.
          readOnly: true
        context_before:
          type: array
          items:
            type: string
          description: Lines before the match (context).
          readOnly: true
        context_after:
          type: array
          items:
            type: string
          description: Lines after the match (context).
          readOnly: true
      description: A single grep match within an artifact.
    agentsV1InputDocument:
      type: object
      properties:
        uri:
          type: string
          description: Data URI of the document.
        filename:
          type: string
          description: Original filename.
      description: Input document (text files, PDFs, code files).
    agentsV1CompactStart:
      type: object
      properties:
        compact_id:
          type: string
          description: Unique identifier linking start and complete events.
        from_event_id:
          type: string
          format: uint64
          description: |-
            Event ID of the first GenerationComplete or CompactComplete to include.
            Everything from this event to now gets compacted.
            If not set, compact entire conversation.
      description: |-
        Marks the start of a compaction operation.
        Blocks user input until CompactComplete is received.
    agentsV1AgentLabels:
      type: object
      properties:
        values:
          type: array
          items:
            type: string
          description: The full desired label set. Empty means the agent has no labels.
      description: |-
        A complete set of agent labels, used where a caller replaces the whole set
        rather than adding or removing individual entries.

        This exists so an update can distinguish "leave the labels alone" from
        "remove every label": a bare `repeated string` field has no presence, so
        both would arrive as an empty list. Wrapped in a message, absence and an
        empty `values` are separate signals.
    agentsV1EventEnqueued:
      type: object
      properties:
        priority:
          $ref: "#/components/schemas/agentsV1QueuePriority"
        events:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1Event"
          description: The events forming the queued group, verbatim.
      description: |-
        A group was appended to the thread's durable queue. Broadcast-only (never
        persisted): the queue is separate store state, fetched in full via GetQueue.
        The first event is the discriminator for the kind of deferred work.
    agentsV1CompactComplete:
      type: object
      properties:
        compact_id:
          type: string
          description: Unique identifier linking to CompactStart.
        content:
          type: string
          description: The compacted content sent to LLM as context.
        usage:
          $ref: "#/components/schemas/agentsV1Usage"
        model:
          type: string
          description: Model the compaction generation ran on, when known.
        provider:
          type: string
          description: Generator kind of the compaction generation, when known.
      description: |-
        Completes a compaction operation with the compacted content.
        Events in the compacted range are replaced by this content
        when building the LLM context.
    agentsV1ThreadStatusState:
      type: string
      enum:
        - THREAD_STATUS_STATE_UNSPECIFIED
        - THREAD_STATUS_STATE_IDLE
        - THREAD_STATUS_STATE_THINKING
        - THREAD_STATUS_STATE_RESPONDING
        - THREAD_STATUS_STATE_EXECUTING_TOOL
        - THREAD_STATUS_STATE_DELEGATING
        - THREAD_STATUS_STATE_COMPACTING
        - THREAD_STATUS_STATE_TRANSFERRING
        - THREAD_STATUS_STATE_AWAITING_ANSWER
        - THREAD_STATUS_STATE_AWAITING_APPROVAL
        - THREAD_STATUS_STATE_AWAITING_TOOL
        - THREAD_STATUS_STATE_SLEEPING
        - THREAD_STATUS_STATE_DELEGATE_BLOCKED
        - THREAD_STATUS_STATE_RETRYING
        - THREAD_STATUS_STATE_FAILED
        - THREAD_STATUS_STATE_STOPPED
      default: THREAD_STATUS_STATE_UNSPECIFIED
      description: The set of thread status discriminants.
    agentsV1TaskStarted:
      type: object
      properties:
        task_id:
          type: string
          description: The delegate's sub-thread id — the stable task identity.
        call_id:
          type: string
          description: The invoke_agent_* call this task was born from.
      description: The delegate's sub-thread was created and its run began.
    agentsV1ToolAdapterDescriptor:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this adapter (nanoid, server-generated).
          readOnly: true
        kind:
          type: string
          description: The adapter kind name (e.g., "jq").
          readOnly: true
        display_name:
          type: string
          description: Human-readable display name (e.g., "JQ Transform").
          readOnly: true
        config:
          type: object
          title: |-
            The adapter configuration as a generic struct.
            Structure depends on the kind:
            - "jq": {input?: string, output?: string}
      description: |-
        Descriptor for a tool adapter instance.
        Used in list responses, mutation responses, and adapter chains.
    agentsV1Reminder:
      type: object
      properties:
        text:
          type: string
          description: The reminder text.
      description: |-
        System-injected reminder for LLM context.
        Used for plan nudges and completion summaries. The raw text is stored
        without XML tags; each generator wraps it in <system-reminder> tags
        during conversion.
    agentsV1TransferRequested:
      type: object
      properties:
        to:
          type: string
          description: The agent to receive control (a referenced local agent id, or "main").
        initiated_by:
          $ref: "#/components/schemas/agentsV1TransferInitiator"
        transfer_id:
          type: string
          description: |-
            Unique transfer id; the originating tool call's id for agent-initiated
            transfers, loop-generated for operator-forced ones.
        message:
          type: string
          description: Optional handoff note to the target (the transfer tool's message argument).
        opaque:
          type: string
          format: byte
          description: Provider-specific opaque blob for faithful replay (e.g. Gemini thought_signature).
        variables:
          type: object
          additionalProperties:
            type: string
          description: |-
            LLM-supplied values for the target profile's exposed (unmapped, non-fixed)
            variables, captured from the transfer tool call. Empty for operator-forced
            transfers and transfer_back.
      description: |-
        The LLM or an operator requested handing the conversation to another agent on
        the same thread. The loop enacts it and appends TransferCompleted (or
        TransferFailed).
    agentsV1ToolResult:
      type: object
      properties:
        tool_call_id:
          type: string
          description: ID of the tool call this is responding to.
        name:
          type: string
          description: Name of the tool that was called.
        content:
          $ref: "#/components/schemas/agentsV1Value"
        success:
          type: boolean
          description: Whether the tool execution was successful.
        error:
          type: string
          description: Error message if the tool execution failed (optional).
        duration_micros:
          type: string
          format: uint64
          description: Duration of tool execution in microseconds (optional).
      description: Result from executing a tool.
    agentsV1ReasoningText:
      type: object
      properties:
        text:
          type: string
          description: The reasoning text content.
        opaque:
          type: string
          format: byte
          description: |-
            Provider-specific opaque data required for multi-turn replay.
            Anthropic: the signature field from thinking blocks.
            OpenAI: the encrypted_content from reasoning items.
        progress_update:
          type: boolean
          description: |-
            True when this block is a progress update rather than reasoning: a short
            note the model writes for the user between tool calls. Clients show it as
            narration; it replays like any other thinking block.
      description: |-
        Reasoning text from the model's chain of thought.
        Only available with OpenAI Responses API for reasoning models.
    agentsV1OutputText:
      type: object
      properties:
        text:
          type: string
          description: The generated output text.
      description: Output text generated by the model.
    agentsV1Ability:
      type: object
      properties:
        name:
          type: string
          description: Short label, e.g. "web search", "PDF editing", "team memory".
        icon:
          type: string
          description: |-
            Icon identifier, as a kebab-case Lucide icon name (e.g. "file-text",
            "git-branch", "map-pin").
        description:
          type: string
          description: Optional one-line description for a tooltip.
      description: A single human-readable agent capability shown on the agent card.
    agentsV1SubAgent:
      type: object
      properties:
        sub_agent_id:
          type: string
          description: The unique sub-agent identifier (nanoid).
          readOnly: true
        kind:
          type: string
          description: The sub-agent caller kind (e.g., "local", "a2a").
          readOnly: true
        config:
          type: object
          description: Kind-specific configuration.
          readOnly: true
        name:
          type: string
          description: Display name shown to the LLM (e.g., "Researcher").
        description:
          type: string
          description: Description of what this sub-agent does (shown to the LLM).
        variable_mappings:
          type: object
          additionalProperties:
            type: string
          description: "Explicit variable mappings: sub-agent var name -> value (supports $parentVar syntax)."
      description: A configured sub-agent belonging to an agent.
    agentsV1StagedChange:
      type: object
      properties:
        id:
          type: string
          description: The artifact URI (e.g., "workspace://src/main.rs").
        change_type:
          $ref: "#/components/schemas/agentsV1ChangeType"
        size:
          type: string
          format: uint64
          description: Size in bytes (for added/modified artifacts).
      description: A staged change to an artifact.
    agentsV1InputArtifact:
      type: object
      properties:
        uri:
          type: string
          description: |-
            Artifact-store URI (uploads://…, result://…, workspace://…). Never a
            data: URI, never an external http(s) URL.
        tokens:
          type: string
          format: uint64
          description: |-
            Token cost of the attached content, measured by the read policy at
            clearance time. Absent on events recorded before clearance carried a
            token count.
      description: |-
        A reference to an artifact-store object attached to the conversation. The
        bytes live in the artifact store; this carries only the reference. MIME type
        and filename are read from artifact-store metadata, not duplicated here.

        Emitted by the generation loop as part of an artifact_read tool response
        when the entire artifact passed the read policy: the artifact is cleared
        for native attachment and generators resolve the URI to bytes at request
        build. Ingestion paths never emit it (uploads produce a Reminder).
    agentsV1TaskFailed:
      type: object
      properties:
        task_id:
          type: string
          description: The delegate's sub-thread id (task identity).
        message:
          type: string
          description: Error message.
        kind:
          $ref: "#/components/schemas/agentsV1GenerationErrorKind"
        call_id:
          type: string
          description: The tool call this failure resolves (invoke or the last resume).
      description: Sub-agent invocation failed.
    agentsV1InterruptAnswer:
      type: object
      properties:
        interrupt_id:
          type: string
          description: The interrupt_id being answered.
        answers:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1QuestionAnswer"
          description: Answers to the questions. Empty if user redirected.
      description: |-
        User's answer to interrupt questions (stored as event).
        Empty answers list indicates user redirected with a different message.
    agentsV1TransferFailed:
      type: object
      properties:
        transfer_id:
          type: string
          description: The transfer_id of the matching TransferRequested.
        reason:
          type: string
          description: Why the transfer was rejected.
      description: A requested transfer was rejected (depth guard, unknown target).
    agentsV1DateTimeValue:
      type: object
      properties:
        rfc3339:
          type: string
      description: |-
        A date-time value as RFC3339 timestamp string.
        Using string because google.protobuf.Timestamp only has second precision
        and RFC3339 is the canonical format used throughout this API.
    agentsV1TransferCompleted:
      type: object
      properties:
        transfer_id:
          type: string
          description: The transfer_id of the matching TransferRequested.
        to:
          type: string
          description: The agent that received control.
        initiated_by:
          $ref: "#/components/schemas/agentsV1TransferInitiator"
      description: |-
        A requested transfer was enacted; the target agent is now active. The active
        agent and the derived transfer stack are recomputed by folding these over the
        log; there is no `from` (it is always the prior top).
    agentsV1InterruptOption:
      type: object
      properties:
        label:
          type: string
          description: Display text for this option (1-5 words).
        description:
          type: string
          description: Explanation of what this option means.
      description: A question option for the user to select.
    agentsV1LiteralStringType:
      type: object
      properties:
        value:
          type: string
          description: The constant string value.
      description: A literal string constant.
    agentsV1EventsDeleted:
      type: object
      properties:
        from_event_id:
          type: string
          format: uint64
          description: First event id of the deleted range (inclusive).
        to_event_id:
          type: string
          format: uint64
          description: Last event id of the deleted range (inclusive).
      description: |-
        Notification that a contiguous range of events was deleted. The deletion is a
        soft-delete: the events remain retrievable with include_deleted, the same
        deletion the DeleteEvent RPC performs. Example triggers are the generation
        loop rolling a turn back and rebuilding it — the offload-and-retry rebuild, or
        RetryDriver between attempts. It carries no event id of its own and is
        broadcast purely so live clients can drop the range from their visible view
        (and flag it deleted in their include_deleted view) the way they reconcile a
        manual delete. On reload the server already excludes the range.
    agentsV1ToolCallArgument:
      type: object
      properties:
        index:
          type: integer
          format: int32
          description: Index of the tool call this belongs to.
        name:
          type: string
          description: Argument name (the JSON key).
        value:
          $ref: "#/components/schemas/agentsV1Value"
      description: |-
        A single named argument for a tool call.
        Each event carries one complete argument (name + typed value).
        Generators emit one event per argument as each top-level key-value
        pair is parsed from the streaming JSON.
    agentsV1ObjectValue:
      type: object
      properties:
        fields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/agentsV1Value"
      description: A structured object with named fields.
    agentsV1SleepFailed:
      type: object
      properties:
        sleep_id:
          type: string
          description: Equal to the sleep_id of the matching SleepRequested.
        message:
          type: string
          description: |-
            Human-readable reason the sleep was rejected; rendered into the error
            tool-result body the model sees.
      description: |-
        A requested sleep was rejected and will never complete. Terminal for the
        matching SleepRequested, the failure counterpart to SleepCompleted.
        Currently emitted when a sub-agent calls sleep (delegates cannot suspend on
        time; the parent owns time-based pauses).
    agentsV1TransferInitiator:
      type: string
      enum:
        - TRANSFER_INITIATOR_UNSPECIFIED
        - TRANSFER_INITIATOR_AGENT
        - TRANSFER_INITIATOR_USER
      default: TRANSFER_INITIATOR_UNSPECIFIED
      description: Who initiated a transfer.
    agentsV1SubAgentOrigin:
      type: object
      properties:
        parent_agent_id:
          type: string
          description: |-
            The agent that issued the delegation (the caller). The sub-thread
            lives under a different agent, so the parent agent id is qualified.
        parent_thread_id:
          type: string
          description: The caller's thread that issued the delegation.
        task_id:
          type: string
          description: The delegation task/call id the sub-thread id was derived from.
      description: A thread created because a parent agent delegated to a sub-agent.
    agentsV1EmptyType:
      type: object
      description: Empty placeholder for simple types that have no additional configuration.
    agentsV1ContextItem:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the context item.
          readOnly: true
        label:
          type: string
          description: Human-readable label for display.
          readOnly: true
        token_count:
          type: integer
          format: int64
          description: Number of tokens this item consumes.
          readOnly: true
        category:
          $ref: "#/components/schemas/agentsV1ContextCategory"
        memory_block:
          $ref: "#/components/schemas/agentsV1MemoryBlockRef"
        tool:
          $ref: "#/components/schemas/agentsV1ToolRef"
      description: A single item contributing to the thread's context window.
    agentsV1NullValue:
      type: object
      description: Placeholder for null values (oneof requires a message type).
    agentsV1Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          format: int32
          description: Number of tokens in the prompt.
        completion_tokens:
          type: integer
          format: int32
          description: Number of tokens in the completion.
        total_tokens:
          type: integer
          format: int32
          description: Total number of tokens used (prompt + completion).
        cache:
          $ref: "#/components/schemas/agentsV1CacheUsage"
      description: Token usage statistics for a generation request.
    agentsV1EnumType:
      type: object
      properties:
        variants:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1ValueTypeDescriptor"
          description: The possible variant types.
      description: |-
        A union/enum type with multiple possible variants.

        Always normalised on construction: at least two variants, distinct under
        structural equality, no nested enums, no `Any` member (`Any` absorbs every
        enum), and `Null` is canonicalised into `OptionalType` rather than
        appearing as a member.
    agentsV1ObjectType:
      type: object
      properties:
        properties:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1ObjectPropertyDescriptor"
          description: The properties of the object.
      description: A structured object type with named properties.
    agentsV1ListValue:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1Value"
      description: A list of values.
    agentsV1DictionaryType:
      type: object
      properties:
        keys:
          $ref: "#/components/schemas/agentsV1ValueTypeDescriptor"
        values:
          $ref: "#/components/schemas/agentsV1ValueTypeDescriptor"
      description: A dictionary/map type.
    agentsV1ModelInfo:
      type: object
      properties:
        model_id:
          type: string
          description: Model identifier (e.g., "gpt-4o", "claude-3-opus").
          readOnly: true
        max_context_tokens:
          type: integer
          format: int64
          description: Maximum context length in tokens.
          readOnly: true
        max_output_tokens:
          type: integer
          format: int64
          description: Maximum output tokens.
          readOnly: true
        supports_vision:
          type: boolean
          description: Whether the model supports vision/images.
          readOnly: true
        supports_tools:
          type: boolean
          description: Whether the model supports tool/function calling.
          readOnly: true
        supports_structured_output:
          type: boolean
          description: Whether the model supports structured output (JSON mode).
          readOnly: true
        supports_streaming:
          type: boolean
          description: Whether the model supports streaming responses.
          readOnly: true
        supports_reasoning:
          type: boolean
          description: Whether the model supports reasoning (chain-of-thought).
          readOnly: true
        display_name:
          type: string
          description: Human-readable display name (e.g., "GPT-4o", "Claude Sonnet 4.5").
          readOnly: true
        family:
          type: string
          description: Model family grouping (e.g., "gpt-4o", "claude-4.5", "qwen2").
          readOnly: true
        license:
          type: string
          description: License information (e.g., for open-weight models).
          readOnly: true
        parameter_count:
          type: string
          format: uint64
          description: Number of model parameters.
          readOnly: true
        quantization:
          type: string
          description: Quantization level (e.g., "Q4_K_M", "Q8_0").
          readOnly: true
        supports_documents:
          type: boolean
          description: Whether the model supports document inputs (PDFs, text files).
          readOnly: true
        max_inline_artifact_bytes:
          type: string
          format: uint64
          description: |-
            Maximum size of a single tool result that can be inlined into a
            generation request, in raw bytes. Already accounts for base64 expansion
            and a safety margin for request overhead.
          readOnly: true
        deprecated:
          type: boolean
          description: "Whether the model is deprecated: still usable, but slated for retirement."
          readOnly: true
        retired:
          type: boolean
          description: |-
            Whether the model is retired: loadable (so existing threads/agents don't
            break) but generation is refused.
          readOnly: true
        replacement_model:
          type: string
          description: Recommended replacement model id when deprecated or retired.
          readOnly: true
        pricing:
          $ref: "#/components/schemas/agentsV1ModelPricing"
      description: Information about a model and its capabilities.
    agentsV1ArtifactValueType:
      type: object
      properties:
        mime_types:
          type: array
          items:
            type: string
          description: |-
            Accepted MIME types (e.g., "text/csv", "application/vnd.apache.parquet").
            Empty means any MIME type is accepted.
      description: An artifact or artifact URI value type with optional MIME type constraints.
    agentsV1GenerationErrorKind:
      type: string
      enum:
        - GENERATION_ERROR_KIND_UNSPECIFIED
        - GENERATION_ERROR_KIND_CONTEXT_TOO_LONG
        - GENERATION_ERROR_KIND_PROVIDER_ERROR
        - GENERATION_ERROR_KIND_API_ERROR
        - GENERATION_ERROR_KIND_CONTENT_FILTERED
        - GENERATION_ERROR_KIND_LENGTH_LIMIT_EXCEEDED
        - GENERATION_ERROR_KIND_INVALID_REQUEST
        - GENERATION_ERROR_KIND_RATE_LIMIT_EXCEEDED
        - GENERATION_ERROR_KIND_SERIALIZATION_ERROR
        - GENERATION_ERROR_KIND_STREAM_ERROR
        - GENERATION_ERROR_KIND_CONFIGURATION_ERROR
        - GENERATION_ERROR_KIND_INTERNAL_ERROR
        - GENERATION_ERROR_KIND_STOPPED
        - GENERATION_ERROR_KIND_SHUTDOWN
        - GENERATION_ERROR_KIND_AUTHENTICATION
        - GENERATION_ERROR_KIND_OVERLOADED
        - GENERATION_ERROR_KIND_STREAM_DROPPED
        - GENERATION_ERROR_KIND_LOST
        - GENERATION_ERROR_KIND_REQUEST_TOO_LARGE
      default: GENERATION_ERROR_KIND_UNSPECIFIED
      description: |-
        Error kind for generation failures.

         - GENERATION_ERROR_KIND_UNSPECIFIED: Unspecified error kind.
         - GENERATION_ERROR_KIND_CONTEXT_TOO_LONG: Input context exceeds the model's maximum token limit.
         - GENERATION_ERROR_KIND_PROVIDER_ERROR: Upstream provider returned an error.
         - GENERATION_ERROR_KIND_API_ERROR: API-level error from the provider.
         - GENERATION_ERROR_KIND_CONTENT_FILTERED: Response was filtered by content safety policies.
         - GENERATION_ERROR_KIND_LENGTH_LIMIT_EXCEEDED: Output exceeded the maximum length limit.
         - GENERATION_ERROR_KIND_INVALID_REQUEST: Request was malformed or invalid.
         - GENERATION_ERROR_KIND_RATE_LIMIT_EXCEEDED: Rate limit was exceeded.
         - GENERATION_ERROR_KIND_SERIALIZATION_ERROR: Failed to serialize or deserialize data.
         - GENERATION_ERROR_KIND_STREAM_ERROR: Error occurred during response streaming.
         - GENERATION_ERROR_KIND_CONFIGURATION_ERROR: Generator configuration is invalid.
         - GENERATION_ERROR_KIND_INTERNAL_ERROR: Internal server error.
         - GENERATION_ERROR_KIND_STOPPED: Generation was stopped by the user or system.
         - GENERATION_ERROR_KIND_SHUTDOWN: Server is shutting down.
         - GENERATION_ERROR_KIND_AUTHENTICATION: Authentication failed (invalid/missing credentials).
         - GENERATION_ERROR_KIND_OVERLOADED: Provider is overloaded / temporarily unavailable.
         - GENERATION_ERROR_KIND_STREAM_DROPPED: Stream ended mid-response without a terminal event (mid-stream drop).
        Distinct from STREAM_ERROR (transient transport blips that may
        succeed on retry): once partial tokens have been delivered to the
        user, retrying produces a different response that won't align with
        what's already shown. Non-retryable by classification.
         - GENERATION_ERROR_KIND_LOST: The server lost this generation: the process running it died
        mid-turn, and the failure was synthesized afterwards to close out
        the dangling thread tail. Distinct from STOPPED (a user action)
        and from provider errors — nothing was wrong with the request.
         - GENERATION_ERROR_KIND_REQUEST_TOO_LARGE: The request payload exceeded the platform's request-size limit (e.g.
        Bedrock's 20 MB / direct API 32 MB cap), distinct from CONTEXT_TOO_LONG
        (a token-window overflow). Recoverable by offloading large tool results
        out of context and retrying.
    agentsV1QueuePriority:
      type: string
      enum:
        - QUEUE_PRIORITY_UNSPECIFIED
        - QUEUE_PRIORITY_TURN_WORK
        - QUEUE_PRIORITY_TRANSFER
        - QUEUE_PRIORITY_USER_INPUT
      default: QUEUE_PRIORITY_UNSPECIFIED
      description: |-
        Structural drain priority of a queued group (lower drains first).

         - QUEUE_PRIORITY_TURN_WORK: Deferred turn work: remote tool calls, control events, sub-agent tasks.
         - QUEUE_PRIORITY_TRANSFER: A transfer request; lands after the rest of the turn.
         - QUEUE_PRIORITY_USER_INPUT: A parked user message; drains after the whole turn.
    agentsV1PrincipalKind:
      type: string
      enum:
        - PRINCIPAL_KIND_UNSPECIFIED
        - PRINCIPAL_KIND_USER
        - PRINCIPAL_KIND_SERVICE
        - PRINCIPAL_KIND_SYSTEM
      default: PRINCIPAL_KIND_UNSPECIFIED
      description: |-
        Categorises a Principal by its origin.

        Used in audit attribution to distinguish a real end user from a
        machine-to-machine caller, and from internal components that
        mutate state without any user on whose behalf they are acting.

         - PRINCIPAL_KIND_USER: Authenticated end user.
         - PRINCIPAL_KIND_SERVICE: Non-human caller (machine-to-machine token, CI job).
         - PRINCIPAL_KIND_SYSTEM: Internal component (scheduler orphan sweep, backfill, etc.).
    agentsV1OptionalType:
      type: object
      properties:
        inner:
          $ref: "#/components/schemas/agentsV1ValueTypeDescriptor"
      description: An optional value type.
    agentsV1ChangeType:
      type: string
      enum:
        - CHANGE_TYPE_UNSPECIFIED
        - CHANGE_TYPE_ADDED
        - CHANGE_TYPE_MODIFIED
        - CHANGE_TYPE_DELETED
      default: CHANGE_TYPE_UNSPECIFIED
      description: |-
        Type of change for a staged artifact.

         - CHANGE_TYPE_UNSPECIFIED: Unspecified change type.
         - CHANGE_TYPE_ADDED: Artifact was added.
         - CHANGE_TYPE_MODIFIED: Artifact was modified.
         - CHANGE_TYPE_DELETED: Artifact was deleted.
    agentsV1ContextCategory:
      type: string
      enum:
        - CONTEXT_CATEGORY_UNSPECIFIED
        - CONTEXT_CATEGORY_FIXED
        - CONTEXT_CATEGORY_VOLATILE
        - CONTEXT_CATEGORY_COMPACTABLE
      default: CONTEXT_CATEGORY_UNSPECIFIED
      description: |-
        Category of context items for token budget management.

         - CONTEXT_CATEGORY_UNSPECIFIED: Unspecified category.
         - CONTEXT_CATEGORY_FIXED: Fixed context that cannot be modified (agent-scoped immutable memory + tools).
         - CONTEXT_CATEGORY_VOLATILE: Volatile context that can be modified (mutable memory blocks).
         - CONTEXT_CATEGORY_COMPACTABLE: Compactable context that can be summarized (conversation history).
    agentsV1ListType:
      type: object
      properties:
        items:
          $ref: "#/components/schemas/agentsV1ValueTypeDescriptor"
      description: A list/array type.
    agentsV1MemoryBlockRef:
      type: object
      properties:
        block_id:
          type: string
          description: The unique block identifier (deterministic hash of block name).
          readOnly: true
        type:
          type: string
          description: The block type (e.g., "text").
          readOnly: true
        display_name:
          type: string
          description: Human-readable label for the block type.
          readOnly: true
        description:
          type: string
          description: Description of the memory block.
          readOnly: true
        scope:
          $ref: "#/components/schemas/agentsV1ScopeLevel"
        mutable:
          type: boolean
          description: Whether the block is mutable.
          readOnly: true
      description: |-
        Lightweight memory block reference for context items.
        Contains only metadata needed for context window visualization.
        Intentionally omits content and config to keep responses lightweight.
    agentsV1ToolRef:
      type: object
      properties:
        id:
          type: string
          description: Stable tool identifier (hash of the original tool name).
          readOnly: true
        name:
          type: string
          description: The tool name (may be adapted name if adapters are applied).
          readOnly: true
        description:
          type: string
          description: Human-readable description of what the tool does.
          readOnly: true
        source_id:
          type: string
          description: The source that provides this tool.
          readOnly: true
        is_adapted:
          type: boolean
          description: Whether this tool has been adapted.
          readOnly: true
        original_name:
          type: string
          description: The original tool name (before any adaptations).
          readOnly: true
      description: |-
        Lightweight tool reference for context items.
        Contains only metadata needed for context window visualization.
        Intentionally omits parameters_schema to keep responses lightweight.
    agentsV1ObjectPropertyDescriptor:
      type: object
      properties:
        name:
          type: string
          description: The property name.
        value_type:
          $ref: "#/components/schemas/agentsV1ValueTypeDescriptor"
        required:
          type: boolean
          description: Whether this property is required.
      description: A named property within an object type.
    agentsV1CacheUsage:
      type: object
      properties:
        read_tokens:
          type: integer
          format: int64
          description: Tokens served from cache on this request.
        write_tokens:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1CacheWrite"
          description: |-
            Tokens written to cache on this request, bucketed by TTL.
            Empty for providers without explicit write accounting.
      description: Prompt cache usage on a single generation request.
    agentsV1ModelPricing:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1DatedRates"
          description: |-
            Effective-dated rate rows. Windows should not overlap; if they do, the
            earliest-starting matching row wins so the outcome is deterministic.
          readOnly: true
      description: |-
        Complete pricing knowledge for one model: its effective-dated rate rows.

        An empty `rows` list is a valid "priced at zero" card for local models —
        distinct from a model carrying no `ModelPricing` at all, which means its
        cost is unknown, not free.
    agentsV1ScopeLevel:
      type: string
      enum:
        - SCOPE_LEVEL_UNSPECIFIED
        - SCOPE_LEVEL_AGENT
        - SCOPE_LEVEL_THREAD
        - SCOPE_LEVEL_USER
      default: SCOPE_LEVEL_UNSPECIFIED
      description: |-
        The scope level for a memory block's content storage.

         - SCOPE_LEVEL_UNSPECIFIED: Unspecified scope (defaults to AGENT).
         - SCOPE_LEVEL_AGENT: Agent-wide scope. Content is shared across all threads.
         - SCOPE_LEVEL_THREAD: Thread-local scope. Each thread has its own copy of the content.
         - SCOPE_LEVEL_USER: User-local scope. Each signed-in user has their own copy of the content,
        which follows them across all of their threads with the agent and is
        invisible to other users. Only kinds whose allowed_scopes include it
        (or list no restriction) accept it.
    agentsV1CacheWrite:
      type: object
      properties:
        tokens:
          type: integer
          format: int64
          description: Number of tokens written into this bucket.
        ttl_seconds:
          type: integer
          format: int64
          description: TTL in seconds for the written bucket (provider-specific interpretation).
      description: A single cache-write bucket — tokens written at a given TTL.
    agentsV1DatedRates:
      type: object
      properties:
        effective_from:
          type: string
          format: date-time
          description: Inclusive start of this row's validity. Absent = open-ended past.
          readOnly: true
        effective_until:
          type: string
          format: date-time
          description: Exclusive end of this row's validity. Absent = open-ended future.
          readOnly: true
        base:
          $ref: "#/components/schemas/agentsV1RateCard"
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1TierRates"
          description: |-
            Long-context tiers: token-threshold bands above `base`, ascending by
            `threshold_tokens`. Empty = flat pricing. A request's total prompt size
            selects the highest tier whose threshold it reaches, or `base` below
            every threshold.
          readOnly: true
      description: |-
        One effective-dated pricing row: the rates in force during a validity
        window. A model whose price changes on a schedule carries several rows
        differing only in rates and effective bounds.
    agentsV1RateCard:
      type: object
      properties:
        input_per_mtok:
          type: number
          format: double
          description: Fresh (uncached) input, USD per million tokens.
          readOnly: true
        output_per_mtok:
          type: number
          format: double
          description: Output, USD per million tokens. Includes reasoning/thinking tokens.
          readOnly: true
        cache_read_per_mtok:
          type: number
          format: double
          description: Tokens served from cache, USD per million tokens.
          readOnly: true
        cache_write_per_mtok:
          type: number
          format: double
          description: |-
            Cache writes at any TTL, USD per million tokens — for providers with a
            single write rate regardless of TTL.
          readOnly: true
        cache_write_by_ttl:
          type: array
          items:
            $ref: "#/components/schemas/agentsV1CacheWriteRate"
          description: Per-TTL cache-write overrides, consulted before `cache_write_per_mtok`.
          readOnly: true
      description: |-
        One complete set of USD-per-million-token rates. A missing cache rate is
        not zero — it means the dimension is unpublished, and cost computation
        falls back loudly (billed at the fresh-input rate, flagged estimated).
    agentsV1CacheWriteRate:
      type: object
      properties:
        ttl_seconds:
          type: integer
          format: int64
          description: |-
            TTL in seconds this rate applies to (e.g. 300 for a 5-minute bucket,
            3600 for a 1-hour bucket).
          readOnly: true
        per_mtok:
          type: number
          format: double
          description: USD per million tokens written into this bucket.
          readOnly: true
      description: USD rate for cache writes at one specific TTL bucket.
    agentsV1TierRates:
      type: object
      properties:
        threshold_tokens:
          type: integer
          format: int64
          description: |-
            Prompt-size threshold (total prompt tokens: fresh + cache read + cache
            write) at which these rates activate.
          readOnly: true
        card:
          $ref: "#/components/schemas/agentsV1RateCard"
      description: |-
        One long-context tier band: requests whose total prompt tokens meet or
        exceed `threshold_tokens` (and fall below the next tier's threshold, when
        one exists) bill the entire request — every class, input and output — at
        `card` instead of the base card.
