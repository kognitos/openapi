  ? "/api/v1/organizations/{organization_id}/workspaces/{workspace_id}/agents/{agent_id}/threads/{thread_id}/artifacts/{artifact_uri}:thumbnail"
  : get:
      summary: Get Artifact Thumbnail
      description: |-
        Fetch a server-rendered thumbnail of an artifact

        Returns a rendered preview image for the artifact at
        `artifact_uri`. The first request renders the image; subsequent
        requests for identical artifact bytes serve from a thread-scoped
        cache.

        Returns `404` when the artifact does not exist or the file
        type has no preview support — clients should fall back to a
        generic file-type icon.

        Returns `500` when rendering failed.
      operationId: GetArtifactThumbnail
      responses:
        "200":
          description: Rendered thumbnail bytes.
          headers:
            ETag:
              description: Strong validator derived from `sha256(artifact bytes) + size`.
              schema:
                type: string
            Cache-Control:
              description: Always `public, max-age=31536000, immutable` since thumbnails are content-addressed.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: Cached body matches `If-None-Match` — no body returned.
        "400":
          description: Invalid `size` parameter.
        "404":
          description: Artifact missing or file type has no preview support — client should fall back to
            a generic icon.
        "500":
          description: Thumbnail render or store error.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: agent_id
          in: path
          description: The ID of the agent that owns the thread.
          required: true
          schema:
            type: string
        - name: thread_id
          in: path
          description: The ID of the thread the artifact belongs to.
          required: true
          schema:
            type: string
        - name: artifact_uri
          in: path
          description: |-
            The artifact URI (e.g. `uploads://report.pdf`,
            `workspace://src/main.rs`). Must be URL-encoded so the `://`
            and any embedded slashes survive routing as a single path
            segment.
             Percent-encode the URI in the path, for example `workspace%3A%2F%2Fsrc%2Fmain.rs`.
          required: true
          schema:
            type: string
        - name: size
          in: query
          description: Logical size bucket — `small` (~140 px) or `medium` (~320 px). Defaults to `small`.
          required: false
          schema:
            type: string
            enum:
              - small
              - medium
            default: small
        - name: If-None-Match
          in: header
          description: Conditional GET. When the ETag matches the cached thumbnail, the server responds
            `304 Not Modified` with no body.
          required: false
          schema:
            type: string
      tags:
        - Agents
