          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: agent_id
          description: Required. The ID of the agent that owns the thread.
          in: path
          required: true
          schema:
            type: string
        - name: thread_id
          description: Required. The ID of the thread to send the message to.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/agentsThreadServiceSendMessageSyncBody"
        required: true
      tags:
        - Agents
