  ? "/api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}/agents/hermes/threads/{thread_id}/uploads"
  : post:
      summary: Upload Thread File (Hermes, automation)
      description: |-
        Upload a file to a thread

        Accepts a `multipart/form-data` body with a single `file` part
        and stores it for the thread under `uploads://<filename>`.
        Returns the artifact URI plus the recorded MIME type, byte
        size, and filename.

        The MIME type is taken from the part's `Content-Type` header when
        the browser supplies one, falls back to a guess based on the
        filename extension, and finally to `application/octet-stream`.

        Multipart parts other than `file` are accepted and ignored, leaving
        room for forward-compatible additions (e.g. a content hash, a TTL
        override) without breaking older servers.

        **Client example (browser, with progress):**
        ```javascript
        const form = new FormData();
        form.append('file', file);

        const xhr = new XMLHttpRequest();
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            console.log(`uploaded ${e.loaded} / ${e.total}`);
          }
        };
        xhr.onload = () => {
          if (xhr.status === 200) {
            const { uri } = JSON.parse(xhr.responseText);
            // include `uri` in SendMessage.documents
          }
        };
        xhr.open('POST', `/api/v1/agents/${agentId}/threads/${threadId}/uploads`);
        xhr.send(form);
        ```

        Targets the built-in `hermes` agent in the automation scope; the generic form is `UploadThreadFile` on `/agents/{agent_id}`.
      operationId: AutomationHermesUploadThreadFile
      responses:
        "200":
          description: Upload accepted; artifact written to uploads://&lt;filename&gt;.
          content:
            application/json:
              schema:
                type: object
                required:
                  - uri
                  - mime_type
                  - size
                  - filename
                properties:
                  uri:
                    type: string
                    description: Artifact URI to embed in SendMessage.documents.
                    example: uploads://report.pdf
                  mime_type:
                    type: string
                    description: MIME type recorded on the artifact.
                    example: application/pdf
                  size:
                    type: integer
                    format: int64
                    description: Size of the stored content in bytes.
                  filename:
                    type: string
                    description: Filename the artifact is stored under within the uploads:// store.
        "400":
          description: Multipart body missing the `file` part, missing a filename, or otherwise malformed.
        "404":
          description: Agent or thread not found.
        "413":
          description: Payload too large (server body-size limit exceeded).
        "500":
          description: Internal store error.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: automation_id
          in: path
          required: true
          schema:
            type: string
        - name: thread_id
          in: path
          description: The ID of the thread the upload is staged into.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The file payload. The part's filename and Content-Type are recorded on the
                    artifact.
      tags:
        - Agents
  ? "/api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}/agents/hermes/threads/{thread_id}:compact"
