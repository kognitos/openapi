  ? "/api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}/runs/{run_id}/agents/astral2/threads/{thread_id}:wake"
  : post:
      summary: Wake Thread (Astral2, run)
      description: |-
        Wakes a thread that is currently sleeping (UI "Wake up" button).

        Atomically ends the pending sleep with `interrupted_by_user = true`,
        cancels the scheduled wake task, and triggers a new generation so the
        LLM observes the early return in its rebuilt history. No-op when no
        sleep is pending; the call still triggers a normal Reminder-driven
        resume in that case.

        Targets the built-in `astral2` agent in the run scope; the generic form is `WakeThread` on `/agents/{agent_id}`.
      operationId: RunAstral2WakeThread
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agentsV1WakeResponse"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: automation_id
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: thread_id
          description: Required. The ID of the sleeping thread to wake.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/agentsThreadServiceWakeBody"
        required: true
      tags:
        - Agents
