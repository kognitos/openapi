        ```javascript
        const eventSource = new EventSource('/agents/my-agent/threads/my-thread/stream');
        eventSource.onmessage = (e) => {
          const event = JSON.parse(e.data);
          if (event.output_text) {
            console.log('Output:', event.output_text.text);
          }
        };
        ```

        This is the browser-compatible alternative to the gRPC `SubscribeThread` RPC.

        Targets the built-in `prime` agent in the automation scope; the generic form is `StreamThreadEvents` on `/agents/{agent_id}`.
      operationId: AutomationPrimeStreamThreadEvents
      responses:
        "200":
          description: SSE stream of thread events
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-sent events; each `data:` line is a JSON `agentsV1Event`.
        "404":
