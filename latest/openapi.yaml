      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: agent_id
          description: Required. The ID of the agent that owns the thread.
          in: path
