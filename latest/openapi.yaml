  ? "/api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}/runs/{run_id}/agents/astral2/threads/{thread_id}:compact"
  : post:
      summary: Compact Thread (Astral2, run)
      description: |-
        Starts context compaction for a thread.

        Compaction summarizes conversation history to reduce context size while
        preserving essential information. This RPC emits a CompactStart event
        and returns the compact_id for tracking.

        The actual compaction is performed asynchronously. Once complete, a
        CompactComplete event with the summary content should be added to the
        thread using the returned compact_id.

        While compaction is in progress (CompactStart without CompactComplete),
        the UI should block user input.

        Targets the built-in `astral2` agent in the run scope; the generic form is `CompactThread` on `/agents/{agent_id}`.
      operationId: RunAstral2CompactThread
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agentsV1StartCompactionResponse"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: automation_id
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: thread_id
          description: Required. The ID of the thread to compact.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/agentsThreadServiceStartCompactionBody"
        required: true
      tags:
        - Agents
