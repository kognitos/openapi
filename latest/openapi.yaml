  ? "/api/v1/organizations/{organization_id}/workspaces/{workspace_id}/books/{book_name}/versions/{book_version}/connections/{connection_id}/agents/shifu/threads/{thread_id}/tools"
  : get:
      summary: List Tools (Shifu, book connection)
      description: |-
