        Compaction summarizes conversation history to reduce context size while
        preserving essential information. This RPC emits a CompactStart event
        and returns the compact_id for tracking.

        The actual compaction is performed asynchronously. Once complete, a
        CompactComplete event with the summary content should be added to the
        thread using the returned compact_id.

        While compaction is in progress (CompactStart without CompactComplete),
        the UI should block user input.

        Targets the built-in `hermes` agent in the workspace scope; the generic form is `CompactThread` on `/agents/{agent_id}`.
      operationId: HermesCompactThread
