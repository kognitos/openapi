          in: path
          required: true
          schema:
            type: string
        - name: thread_id
          description: Required. The ID of the thread to inject the call into.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/agentsThreadServiceSendToolCallBody"
        required: true
